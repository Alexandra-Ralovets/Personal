function sheet(title, items) {
  return `<div class="fm-sheet__head"><span class="m-title">${title}</span></div>
    <div class="fm-sheet__body">${items.join('')}</div>`;
}
function item(icon, label, attrs, on, danger) {
  return `<button class="fm-sheet__item ${danger ? 'is-danger' : ''}" ${attrs || ''}>
    ${ic(icon)}<span>${label}</span>${on ? ic(I.check, 'fm-i--s fm-check') : ''}</button>`;
}
/* Шторки, которые нельзя перерисовывать на ходу: в них набирают текст. */
const KEEP_SHEET = ['newfolder', 'newtpl', 'confirm'];
function openSheet(kind, id) {
  if (OFF_SHEETS.includes(kind)) return;
  M.sheet = kind; M.sheetId = id || null;
  $('#sheet').innerHTML = (SHEETS[kind] || (() => ''))();
  $('#scrim').classList.add('is-open');
}
function closeSheet() { M.sheet = null; $('#scrim').classList.remove('is-open'); }

/* ============================== ЗАПИСЬ ВСТРЕЧИ ============================ */
let recTimer = null;
/* Реплики, которые «слышит» прототип. Берутся из настоящей демонстрационной
   записи и ровно они же остаются в сохранённой записи — показанное на экране и
   сохранённое совпадают, вместо экрана расшифровки одно, а в записи другое. */
function recTick(on) {
  clearInterval(recTimer); recTimer = null;
  if (on) recTimer = setInterval(() => {
    if (!M.rec.on || M.rec.paused) return;
    M.rec.sec++;
    const src = REC_SRC();
    /* Живая расшифровка: слова появляются по ходу речи. Этим приложение
       доказывает, что слышит именно речь, ещё до первой остановки. */
    const want = recLinesAt(M.rec.sec);
    if (want > M.rec.lines.length) {
      const s = src[M.rec.lines.length];
      M.rec.lines.push({ who: s.who, role: s.role, text: s.text, at: M.rec.sec });
      /* Подсказка идёт СЛЕДОМ за репликой, на которую отвечает. Правило одно на
         два прототипа и живёт в общей части (`hintsAfter`). */
      if (hintsLive()) M.rec.hints = hintsAfter(ORG.hintProfile, M.rec.lines.length);
      else M.rec.hints = [];
      render(); return;                               // строка пришла — перерисовываем целиком
    }
    if ($('#recTime')) $('#recTime').textContent = fmtTotal(M.rec.sec);
  }, 1000);
}
/* auto — чем вызвана запись: пусто у ручного старта, иначе причина (звонок на
   Android, напоминание о встрече). Место кончилось — запись не начинается, и
   отказ называет причину. */
function recStart(auto) {
  if (!ORG.server) { toast(t('Сервер организации не задан. Запись не начинается.')); return; }
  if (diskBlocked()) { toast(diskWhy()); return; }
  if (auto) {
    SESSION.recCard = CARDS[0];
    SESSION.recBind = 'calendar';
  }
  M.rec = { on: true, paused: false, sec: 0, saved: null, lines: [], marks: [], auto: auto || null, hints: [] };
  recTick(true); render();
}
/* Отмена — единственное необратимое действие: остановка сохраняет запись,
   отмена её удаляет. Поэтому только через подтверждение. */
function recCancel(falseAlarm) {
  M.rec = { on: false, paused: false, sec: 0, saved: null, lines: [], marks: [], auto: null, hints: [] };
  recTick(false); render();
  toast(falseAlarm ? 'Ложная тревога: запись удалена, на сервер не ушла'
                   : 'Запись отменена — файл удалён, на сервер не ушёл');
}
function recStop() {
  const sec = Math.max(1, M.rec.sec), d = new Date();
  const seg = M.rec.lines.map(l => T(fmtTotal(Math.max(0, l.at - REC_STEP)), l.who, l.role, l.text));
  const n = recNewFile({
    id: 'r' + d.getTime().toString(36), title: t('Запись от') + ' ' + fmtDate(d.getTime()),
    ts: d.getTime(), sec, at: 0, folder: null, src: 'Телефон', custom: [],
    transcript: seg, transcriptEmpty: seg.length ? undefined : true, summaryEmpty: true,
    card: SESSION.recCard ? { id: SESSION.recCard.id, name: SESSION.recCard.name } : null,
    bind: SESSION.recCard ? (SESSION.recBind || 'picked') : null
  });
  FILES.unshift(n);
  if (M.rec.marks.length) M.marks[n.id] = M.rec.marks.slice();
  applyLang();
  /* Связи нет — запись встаёт в очередь отправки, а не теряется. */
  if (!LINK.live) QUEUE.push({ id: 'q' + n.id, title: n.title, sec, state: 'wait' });
  M.rec = { on: false, paused: false, sec: 0, saved: n.id, lines: [], marks: [], auto: null, hints: [] };
  recTick(false); render();
}
function recOverlay() {
  /* Задержки не по кругу из семи, иначе полоски складываются в три
     одинаковых пучка и видно, что это узор, а не звук. */
  const bars = Array.from({ length: 42 }, (_, i) => `<span style="animation-delay:${(i * 37) % 880}ms"></span>`).join('');
  if (M.rec.on) {
    const lines = M.rec.lines;
    const mand = isMandatory();
    const last = hintsLive() ? M.rec.hints[M.rec.hints.length - 1] : null;
    const airec = micIsAirec();
    const prof = HINT_PROFILES.find(x => x.id === ORG.hintProfile) || HINT_PROFILES[0];
    return `
    <div class="m-rec">
      <!-- Отмена стоит отдельно от остановки: остановка сохраняет запись,
           отмена её удаляет. Единственное необратимое действие экрана. -->
      <button class="m-rec__x" data-reccancel="1" aria-label="${t('Отменить запись')}">${ic(I.close, 'fm-i--l')}</button>
      <div class="m-rec__top">
        <div class="m-rec__head m-sub"><span class="m-rec__dot"></span>${M.rec.paused ? t('Запись на паузе') : t('Идёт запись встречи')}</div>
        <div class="m-rec__time m-num" id="recTime">${fmtTotal(M.rec.sec)}</div>
        ${M.rec.auto ? `<p class="m-rec__note m-cap" style="margin:0">${
          /* На Android приложение начинает запись само, на iPhone — нет: включить
             микрофон, пока приложение не открыто, система не даёт, поэтому там
             запись начинают одним нажатием по напоминанию. Это единственное
             честное отличие рамок, проверенное по документации Apple, и «началась
             сама» его стирало (правка 28.08.2026). Фраза собирается целиком на
             каждой рамке: у неё разный порядок слов, подстановкой такое не
             покрыть. */
          OS === 'android' ? t('Запись началась сама:') + ' ' + t(M.rec.auto)
                           : t('Запись начали одним нажатием по напоминанию о встрече')
        }</p>` : ''}
      </div>
      ${mand ? `<div class="m-warn m-cap">${ic(I.lock, 'fm-i--s')}
        <span>${t('Режим организации: запись обязательна. Пауза и отмена выключены.')}</span></div>` : ''}
      <!-- ГЛАВНОЕ ОТЛИЧИЕ ПРОДУКТА: подсказка приходит во время разговора.
           Показана последняя, остальные — по нажатию, шторкой. -->
      <div class="m-hintbox">
        ${airec ? `<div class="m-hint__wait m-cap">${ic(I.alert, 'fm-i--s')}
            <span>${t('Живых подсказок с диктофона нет: живой поток AIREC не прошёл приёмку.')}</span></div>`
        : `<div style="display:flex;align-items:center;gap:var(--space-m);margin:0 0 var(--size-3x)">
          <span class="m-cap" style="flex:1 1 auto">${t(!SESSION.hintsOn ? 'Подсказки выключены' : LINK.live ? 'Подсказки включены' : 'Живых подсказок нет')}</span>
          <button class="fm-btn fm-btn--sm" data-hintstog="1">${t(SESSION.hintsOn ? 'Выкл' : 'Вкл')}</button>
        </div>
        ${last
          ? `<button class="m-hint" data-sheet="hints">
              <div class="m-hint__head">
                <span class="fm-tag fm-tag--cyan">${t(last.kind)}</span>
                <span class="m-tiny m-dim" style="margin-left:auto">${t(prof.name)} · ${M.rec.hints.length}</span>
              </div>
              <h3 class="m-hint__t m-head">${t(last.title)}</h3>
              <p class="m-hint__b m-sub">${t(last.body)}</p>
              ${last.note ? `<p class="m-hint__b m-cap m-dim" style="margin-top:var(--space-xs)">${t(last.note)}</p>` : ''}
              <p class="m-hint__src m-cap">${ic(I.book, 'fm-i--s')} ${t(last.src)}</p>
              ${crmHintHtml(last, 'm')}
            </button>`
          : `<div class="m-hint__wait m-cap">${ic(LINK.live && SESSION.hintsOn ? I.bulb : I.alert, 'fm-i--s')}
              <span>${t(!SESSION.hintsOn
                ? 'Подсказки выключены — запись идёт.'
                : LINK.live
                ? 'Слушаем разговор — подсказка придёт, когда будет чем помочь'
                : 'Связи с сервером нет: запись доедет, живых подсказок нет')}</span></div>`}`}
      </div>
      <div class="m-rec__live" id="recLive">
        ${airec ? `<div class="m-rec__wait m-sub">${t('Текст появится, когда запись с диктофона дойдёт до сервера')}</div>`
          : lines.length ? lines.map((l, i) => `<p class="m-rec__line m-body">
            <b>${esc(l.who)}</b><br>${esc(l.text)}</p>`).join('')
          : `<div class="m-rec__wait m-sub">${ic(I.spin, 'fm-i--s')} ${t('Слушаем — текст появится, как только начнут говорить')}</div>`}
      </div>
      <div class="m-rec__bottom">
        <div class="m-level" style="${M.rec.paused ? 'opacity:.25' : ''}">${bars}</div>
        <p class="m-rec__note m-cap" style="margin:0">${recSourceLine()}</p>
        <div class="m-rec__acts">
          <span class="m-rec__side" aria-hidden="true"></span>
          <button class="m-rec__stop" data-recstop="1" aria-label="${t('Остановить')}">${ic(I.stop, 'fm-i--l')}</button>
          <button class="m-rec__side" data-recpause="1">
            ${ic(mand ? I.lock : (M.rec.paused ? I.mic : I.pause), 'fm-i--l')}<span>${M.rec.paused ? t('Продолжить') : t('Пауза')}</span></button>
        </div>
        <p class="m-rec__note m-cap" style="margin:0">${t('Экран можно погасить — запись не прервётся')}</p>
      </div>
    </div>`;
  }
  if (M.rec.saved) {
    const f = FILES.find(x => x.id === M.rec.saved);
    /* Возврат к списку записей стрелкой сверху (решение владельца 28.08.2026).
       Без него экран был тупиком: выйти можно было только внутрь записи или
       начав новую. Манера возврата — та же, что в панели обычного экрана:
       шеврон в iOS, стрелка в Material. */
    return `<div class="m-rec">
      <div class="m-nav">
        <button class="fm-btn fm-btn--icon" data-recdone="1" aria-label="${t('К записям')}">${
          ic(OS === 'android' ? I.back : I.backIos, 'fm-i--l')}</button>
      </div>
      <div class="m-rec__done">
        <div class="m-rec__head m-sub">${ic(I.check, 'fm-i--s')} ${t('Запись сохранена')}</div>
        <div class="m-rec__time m-num">${f ? f.total : '—'}</div>
        <p class="m-rec__note m-cap" style="margin:0">${t('Расшифровка уже есть')}</p>
        <p class="m-rec__note m-cap" style="margin:0">${t(LINK.live
          ? 'Запись уходит на сервер организации.'
          : 'Связи нет — запись встала в очередь отправки и уйдёт сама.')}</p>
        ${f ? crmBannerHtml(f, 'm') : ''}
        ${f ? recCardActionsHtml(f.id, 'm') : ''}
        <div>
          <button class="fm-btn fm-btn--primary" data-file="${M.rec.saved}">${t('Открыть запись')}</button>
          <div style="height:var(--size-3x)"></div>
          <button class="fm-btn" data-recnew="1">${t('Записать ещё')}</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

/* ============================== ОТРИСОВКА ================================= */
const TABS = [
  ['folders', 'Записи', I.files],
  ['more', 'Ещё', I.more]
];
/* Какие экраны лежат внутри какого раздела: подсветка раздела не должна гаснуть
   при уходе на вложенный экран. */
const TAB_OF = { folders: 'folders', files: 'folders', note: 'folders', search: 'folders',
                 ask: 'ask', templates: 'templates', more: 'more', set: 'more', membership: 'more',
                 devices: 'more', outbox: 'more' };
const SCREENS = { folders: screenFolders, files: screenFiles, note: screenNote, search: screenSearch,
                  ask: screenAsk, templates: screenTemplates, more: screenMore, set: screenSet,
                  membership: screenMembership, devices: screenDevices, outbox: screenOutbox };
/* Кнопка записи живёт там, где действие уместно — на папках и в списке записей;
   на чужих разделах её нет, иначе она читается как «записать шаблон». */
const FAB_ON = ['folders', 'files'];
/* Снятое с живого экрана (contour-live-ui.mdc) не открывается и прямым адресом:
   «Спросить ИИ», шаблоны, членство, отдельная «Отправка». Обход меню ссылкой
   иначе возвращал бы в прототип лишний объём (проверка 23.09.2026). */
const OFF_SCREENS = ['ask', 'templates', 'membership', 'outbox'];
const OFF_SHEETS = ['askscope', 'addtpl', 'newtpl', 'tpl', 'share'];
function render() {
  if (OFF_SCREENS.includes(M.screen)) M.screen = 'folders';
  const fab = FAB_ON.includes(M.screen)
    ? `<button class="m-fab" data-recnow="1" aria-label="${t('Записать встречу')}">${ic(I.mic, 'fm-i--l')}</button>` : '';
  let body = (SCREENS[M.screen] || screenFolders)();
  $('#app').innerHTML = body + fab + recOverlay();
  /* Панель разделов видна на КАЖДОМ экране: по HIG её скрытие лишает человека
     ответа «в каком я разделе». Единственное исключение — модальный экран
     записи встречи, он закрывает всё сам. Проигрыватель открытой записи стоит
     аксессуаром НАД панелью, а не вместо неё. */
  const acc = $('#acc');
  acc.hidden = M.screen !== 'note';
  acc.innerHTML = M.screen === 'note' ? miniPlayer(file()) : '';
  $('#tabbar').innerHTML = TABS.map(([k, label, icon]) =>
    `<button class="${TAB_OF[M.screen] === k ? 'is-on' : ''}"
        data-go="${k}">${ic(icon, 'fm-i--tab')}<span>${label}</span></button>`).join('');
  const clock = new Date();
  $('#clock').textContent = clock.getHours() + ':' + p2(clock.getMinutes());
  ['#q', '#findQ'].forEach(sel => {
    const el = $(sel);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  /* Открытая шторка тоже рисуется из состояния, поэтому обновляется вместе с
     экраном: иначе пришедшая подсказка в ней не появлялась, а список устаревал
     молча. Шторки с полем ввода не трогаем — перерисовка стёрла бы набранное. */
  if (M.sheet && !KEEP_SHEET.includes(M.sheet)) {
    $('#sheet').innerHTML = (SHEETS[M.sheet] || (() => ''))();
  }
  /* Живая расшифровка идёт за речью: последняя реплика всегда на виду. */
  const live = $('#recLive'); if (live) live.scrollTop = live.scrollHeight;
  /* Открыли запись — сразу показываем место, на котором остановились: иначе
     звучащая реплика подсвечена где-то за экраном. Прокручиваем ОДИН раз на
     запись и вкладку, а не при каждой перерисовке, иначе текст не полистать. */
  const nowSeg = $('.m-seg-row.is-now'), key = M.screen + ':' + M.fileId + ':' + M.tab;
  if (nowSeg && M.seenKey !== key) scrollWithin(nowSeg, true);
  M.seenKey = key;
  /* Крупный заголовок уезжает вместе с содержимым, в панели проступает
     компактный — так делают системные приложения телефона. */
  const sc = $('#scroll');
  if (sc) sc.addEventListener('scroll', () => {
    const n = $('#nav');
    if (n) n.classList.toggle('is-scrolled', sc.scrollTop > 12);
  });
  paintPlayer();
  /* Плашка прототипа тоже рисуется из состояния: сменили режим организации —
     подсветка переключателя обязана сойтись с тем, что показывает экран. */
  paintPlaque();
}

/* ================================ СОБЫТИЯ ================================= */
function goScreen(k) {
  stopPlay();
  if (k === 'ask' || k === 'templates' || k === 'membership' || k === 'search' || k === 'outbox') k = 'folders';
  M.screen = k;
  render();
}
/* Куда ведёт возврат — один владелец на кнопку в панели и на жест от края. */
const UP = { set: 'more', membership: 'more', note: 'files', files: 'folders', search: 'folders',
             devices: 'more', outbox: 'more' };
function goBack() {
  /* Из записи возвращаемся туда, откуда её открыли, и только если этого не
     известно — по карте вверх. Карта одна на кнопку в панели и на жест от края,
     второго владельца возврата не заводим. */
  if (M.screen === 'note' && M.came) {
    const c = M.came;
    M.came = null;
    M.screen = c.screen; M.scope = c.scope; M.q = c.q; M.ask = c.ask;
    stopPlay(); render();
    return true;
  }
  const up = UP[M.screen];
  if (!up) return false;                 // корневой экран раздела — возвращаться некуда
  M.came = null;
  M.screen = up; stopPlay(); render();
  return true;
}
/* Жест возврата от левого края. У Apple это жест ПРИЛОЖЕНИЯ и работает на
   вложенном экране; у Google жест СИСТЕМНЫЙ — он есть всегда, поэтому в
   Android-оболочке внизу корпуса стоит полоска системного жеста. */
let edge = null;
document.addEventListener('pointerdown', e => {
  const box = $('#phone').getBoundingClientRect();
  if (e.clientX - box.left > 26 || M.sheet) return;
  edge = { x: e.clientX, y: e.clientY };
});
document.addEventListener('pointerup', e => {
  if (!edge) return;
  const dx = e.clientX - edge.x, dy = Math.abs(e.clientY - edge.y);
  edge = null;
  if (dx > 60 && dy < 50) goBack();
});
/* Открытие записи. Пришли из поиска по слову — открываем на расшифровке в том
   месте, где слово прозвучало, и держим слово подсвеченным: иначе после поиска
   его пришлось бы искать заново уже внутри записи. */
function openFile(id, at, q) {
  const f = FILES.find(x => x.id === id);
  if (!f) return;
  stopPlay();
  /* Откуда пришли — чтобы «назад» вернуло ТУДА ЖЕ (правка 28.08.2026 по
     замечанию владельца). Возврат из записи вёл по жёсткой карте — всегда в
     список записей, — поэтому человек, открывший запись из поиска или из
     «Спросить», возвращался не к своим результатам, а в общий список: запрос и
     найденное пропадали, и путь приходилось повторять. Запоминаем один уровень:
     глубже записи в прототипе не уходят. */
  if (M.screen !== 'note') M.came = { screen: M.screen, scope: { ...M.scope }, q: M.q, ask: { ...M.ask } };
  M.fileId = id; M.screen = 'note';
  const seeked = at !== undefined && at !== null && at !== '';
  if (seeked) f.at = Math.max(0, Math.min(f.sec, +at));
  M.find = q || ''; M.findOpen = !!q;
  M.tab = 'transcript';
  M.rec.saved = null;
  render();
}
const targets = v => [v === 'cur' ? M.fileId : v];

/* Подтверждение необратимого действия — шторкой снизу: модальные окна на
   телефоне чужие, а решение всё равно требует ответа. */
function askConfirm(text, act) {
  M.confirm = { ...text, act };
  openSheet('confirm');
}
/* Забрать записи с диктофона по-настоящему: запись уходит с устройства и
   появляется в списке с источником «Диктофон». */
function devTake(ids) {
  const taken = [];
  ids.forEach(id => {
    const i = DEV_RECS.findIndex(r => r.id === id);
    if (i < 0) return;
    const r = DEV_RECS[i], d = devById(r.dev);
    if (!d || d.link === 'off') return;
    DEV_RECS.splice(i, 1);
    FILES.unshift({
      id: 'dv' + r.id, title: r.title, ts: r.ts, sec: r.sec, at: 0,
      folder: null, src: 'Диктофон', custom: [],
      transcript: [], transcriptEmpty: true, summaryEmpty: true
    });
    taken.push(r);
  });
  if (!taken.length) { toast('Диктофон не на связи — записи заберём, когда он ответит'); return; }
  applyLang();
  if (!LINK.live) taken.forEach(r => QUEUE.push({ id: 'q' + r.id, title: r.title, sec: r.sec, state: 'wait' }));
  render();
  toast(phraseTaken(taken.length), true);
}

/* Выгрузка отдаёт настоящий файл, собранный из содержимого записи. */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: (type || 'text/plain') + ';charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const asText = f => f.title + '\n' + f.date + ' · ' + f.dur + '\n\n'
  + (f.transcript || []).map(x => x.time + '  ' + x.who + ': ' + x.text).join('\n');
const asSummary = f => f.title + '\n' + f.date + '\n\n'
  + plain(String(f.summary || '').replace(/<\/(p|li|h1|h2|ul|ol)>/g, '\n'))
      .replace(/[ \t]+/g, ' ').replace(/\n\s+/g, '\n').trim();
const safeName = x => x.replace(/[\\/:*?"<>|]/g, '-').slice(0, 60);

document.addEventListener('click', e => {
  /* Полосу только что протащили мышью — это была прокрутка, а не нажатие на
     чипс, оказавшийся под курсором. */
  if (stripDragged) { stripDragged = false; return; }
  const hit = s => e.target.closest(s);

  /* --- шторка --- */
  if (hit('[data-closesheet]')) { closeSheet(); return; }
  if (hit('#scrim') && !hit('.fm-sheet')) { closeSheet(); return; }

  /* --- язык и тема (плашка над телефоном и раздел настроек) --- */
  const sl = hit('[data-setlang]');
  if (sl) {
    setLang(sl.dataset.setlang);
    paintPlaque(); render();
    if (M.sheet) openSheet(M.sheet, M.sheetId);
    return;
  }
  const so = hit('[data-setos]');
  if (so) { setOs(so.dataset.setos); render(); return; }
  if (hit('[data-theme-toggle]')) {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    return;
  }

  /* --- навигация --- */
  if (hit('[data-back]')) { goBack(); return; }
  const go = hit('[data-go]');
  if (go) {
    if (go.dataset.go === 'search') { M.screen = 'search'; render(); return; }
    goScreen(go.dataset.go); return;
  }
  const sc = hit('[data-scope]');
  if (sc) {
    M.scope = { kind: sc.dataset.scope, value: sc.dataset.value || null };
    M.screen = 'files'; M.sort = 'date'; render(); return;
  }
  const st = hit('[data-set]');
  if (st) { M.setPane = st.dataset.set; M.screen = 'set'; render(); return; }

  /* --- запись встречи --- */
  if (hit('[data-recnow]')) { recStart(); return; }
  /* Режим «запись обязательна» не гасит кнопку молча: она нажимается и
     называет причину. Остановка при этом разрешена — запись сохраняется. */
  if (hit('[data-recpause]')) {
    if (isMandatory()) { toast(MANDATORY_WHY); return; }
    M.rec.paused = !M.rec.paused; render(); return;
  }
  if (hit('[data-recstop]')) { recStop(); return; }
  if (hit('[data-recnew]')) { recStart(); return; }
  if (hit('[data-hintstog]')) {
    SESSION.hintsOn = !SESSION.hintsOn;
    if (!SESSION.hintsOn) M.rec.hints = [];
    render(); return;
  }
  const pc = hit('[data-pickcard]');
  if (pc) { openSheet('pickcard', pc.dataset.pickcard); return; }
  const bc = hit('[data-bindcard]');
  if (bc) {
    recBindCard(bc.dataset.bindcard, bc.dataset.card);
    closeSheet(); render(); return;
  }
  if (hit('[data-clearsessioncard]')) { recClearSessionCard(); render(); return; }
  const nc = hit('[data-notclient]');
  if (nc) { recMarkNotClient(nc.dataset.notclient); render(); return; }
  /* Стрелка на экране сохранённой записи: закрываем слой и показываем список,
     где новая запись стоит первой. */
  if (hit('[data-recdone]')) {
    M.rec = { on: false, paused: false, sec: 0, saved: null, lines: [], marks: [], auto: null, hints: [] };
    recTick(false); goScreen('files'); return;
  }
  if (hit('[data-reccancel]')) {
    if (isMandatory()) { toast(MANDATORY_WHY); return; }
    askConfirm({ title: 'Отменить запись?',
      body: 'Запись будет удалена и на сервер не уйдёт. Восстановить её будет нечем — в отличие от остановки, которая запись сохраняет.',
      yes: 'Отменить запись', no: 'Не отменять' }, () => recCancel(false));
    return;
  }
  if (hit('[data-falsealarm]')) { recCancel(true); return; }
  if (hit('[data-confirmyes]')) {
    const act = M.confirm && M.confirm.act;
    M.confirm = null; closeSheet();
    if (typeof act === 'function') act();
    return;
  }

  /* --- диктофоны --- */
  const dg = hit('[data-devget]');
  if (dg) { devTake([dg.dataset.devget]); return; }
  const da = hit('[data-devall]');
  if (da) {
    const d = devById(da.dataset.devall);
    if (!d || d.link === 'off') { toast('Диктофон не на связи — включите его и держите рядом'); return; }
    const ids = devRecs(d.id).map(r => r.id);
    if (!ids.length) { toast('Новых записей на диктофоне нет', true); return; }
    devTake(ids); return;
  }
  if (hit('[data-devscan]')) { toast('Ищем диктофоны рядом: включите устройство и держите его в метре от телефона'); return; }

  /* --- очередь отправки --- */
  if (hit('[data-qsend]')) {
    if (!QUEUE.length) { toast('Очередь пуста — отправлять нечего'); return; }
    if (!LINK.live) { toast('Связи с сервером нет — отправим сами, как только она появится'); return; }
    const n = QUEUE.length; QUEUE.length = 0;
    render(); toast(phraseSent(n), true); return;
  }
  const qo = hit('[data-qone]');
  if (qo) {
    if (!LINK.live) { toast('Связи с сервером нет — отправим сами, как только она появится'); return; }
    const i = QUEUE.findIndex(q => q.id === qo.dataset.qone);
    if (i > -1) QUEUE.splice(i, 1);
    render(); toast('Запись отправлена на сервер', true); return;
  }

  /* --- режим организации, профиль подсказок, отзыв устройства --- */
  const om = hit('[data-orgmode]');
  if (om) {
    ORG.mode = om.dataset.orgmode; render();
    toast(isMandatory()
      ? 'Режим «запись обязательна» применён сразу — перезапуск не нужен'
      : 'Режим «помощник» применён сразу — перезапуск не нужен');
    return;
  }
  const hp = hit('[data-hintprof]');
  if (hp) {
    ORG.hintProfile = hp.dataset.hintprof; render();
    toast(t('Профиль подсказок:') + ' ' + t(hintProfileName(ORG.hintProfile)), true); return;
  }
  const ot = hit('[data-orgtoggle]');
  if (ot) {
    const k = ot.dataset.orgtoggle;
    ORG[k] = !ORG[k]; render();
    if (k === 'privateCalls') toast(ORG.privateCalls ? PRIVATE_WHY : 'Приватные звонки запрещены сервером: записывается любой разговор');
    else if (k === 'diarization') toast(ORG.diarization ? 'Разделение голосов включено' : 'Разделение голосов выключено: говорящий будет один');
    else if (k === 'server') toast(ORG.server ? t('Сервер организации задан') : t('Сервер организации не задан. Запись не начинается.'));
    return;
  }
  const rv = hit('[data-revoke]');
  if (rv) {
    const ss = SESSIONS.find(x => x.id === rv.dataset.revoke);
    if (!ss) return;
    askConfirm({ title: 'Отозвать доступ?',
      body: t('Устройство') + ' «' + ss.name + '» ' + t('потеряет доступ со следующего запроса. Вернуть доступ может только администратор организации.'),
      yes: 'Отозвать', no: 'Не отзывать' },
      () => { ss.revoked = true; render(); toast('Доступ отозван. Вернуть его может только администратор'); });
    return;
  }
  /* Отметка в момент записи: сказали важное — отметил сразу, не искать потом в
     часовой расшифровке. Отметки переезжают в сохранённую запись. */
  if (hit('[data-recmark]')) {
    const i = M.rec.lines.length - 1;
    if (i < 0) return;
    const has = M.rec.marks.includes(i);
    M.rec.marks = has ? M.rec.marks.filter(x => x !== i) : M.rec.marks.concat(i);
    render(); toast(has ? 'Отметка снята' : 'Место отмечено', true);
    return;
  }

  /* --- список и действия над записью --- */
  const rm = hit('[data-rowmenu]');
  if (rm) { e.stopPropagation(); openSheet('row', rm.dataset.rowmenu); return; }
  const ms = hit('[data-movesheet]');
  if (ms) { openSheet('move', ms.dataset.movesheet); return; }
  const mt = hit('[data-moveto]');
  if (mt) {
    const f = FILES.find(x => x.id === mt.dataset.mid);
    if (f) f.folder = mt.dataset.moveto || null;
    closeSheet(); render(); toast('Запись перемещена', true); return;
  }
  const del = hit('[data-todelete]');
  if (del) {
    const f = FILES.find(x => x.id === del.dataset.todelete);
    if (f) f.deleted = true;
    closeSheet();
    if (M.screen === 'note') M.screen = 'files';
    render(); toast('Запись в корзине', true); return;
  }
  const res = hit('[data-restore]');
  if (res) { const f = FILES.find(x => x.id === res.dataset.restore); if (f) f.deleted = false; closeSheet(); render(); return; }
  /* Удаление навсегда — через подтверждение, как и отмена записи. Прототип сам
     объявил правило «необратимое только через подтверждение», а здесь стирал
     молча: промахнулся строкой в корзине — записи больше нет. */
  const pu = hit('[data-purge]');
  if (pu) {
    const id = pu.dataset.purge;
    askConfirm({ title: 'Удалить навсегда?',
      body: 'Запись исчезнет из корзины, и восстановить её будет нечем.',
      yes: 'Удалить навсегда', no: 'Оставить' },
      () => { const i = FILES.findIndex(x => x.id === id); if (i > -1) FILES.splice(i, 1); toast('Запись удалена навсегда'); });
    return;
  }
  /* Действия активной вкладки — перенос из настольного меню вкладки. */
  if (hit('[data-regen]')) {
    const f = file(); closeSheet();
    delete M.generated[f.id + ':' + M.tab];
    if (M.tab === 'summary') f.summaryEmpty = true;
    render(); return;
  }
  if (hit('[data-deltab]')) {
    const f = file(); closeSheet();
    f.custom = (f.custom || []).filter(c => c.id !== M.tab);
    delete M.generated[f.id + ':' + M.tab];
    M.tab = 'summary'; render(); toast('Разбор удалён', true); return;
  }
  const rn = hit('[data-rename]');
  if (rn) {
    const f = FILES.find(x => x.id === rn.dataset.rename); closeSheet();
    if (!f) return;
    const v = prompt(t('Новое название записи'), f.title);
    if (v && v.trim()) { f.title = v.trim(); render(); }
    return;
  }
  const fl = hit('[data-file]');
  if (fl) {
    const fromSearch = M.screen === 'search' && M.q.trim();
    closeSheet();
    openFile(fl.dataset.file, fl.dataset.at, fromSearch ? M.q : '');
    return;
  }

  /* --- поделиться и выгрузка --- */
  if (hit('[data-share]')) { openSheet('share'); return; }
  if (hit('#shareCopy')) {
    const v = $('#shareLink').value;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).catch(() => {});
    closeSheet(); toast('Ссылка скопирована'); return;
  }
  const ex = hit('[data-export]');
  if (ex) {
    const f = file(); closeSheet();
    if (ex.dataset.export === 'transcript') download(safeName(f.title) + ' — ' + t('расшифровка') + '.txt', asText(f));
    else download(safeName(f.title) + ' — ' + t('конспект') + '.txt', asSummary(f));
    toast('Файл выгружен'); return;
  }

  /* --- проигрыватель --- */
  if (hit('#btnPlay') || hit('[data-playtoggle]')) {
    setPlaying(!M.playing);
    if (M.sheet === 'player') openSheet('player');       // обновить вид кнопки в шторке
    return;
  }
  const sk = hit('[data-seek]');
  if (sk) { const f = file(); if (f) { f.at = posOf(f) + (+sk.dataset.seek); f.at = posOf(f); paintPlayer(); } return; }
  const wv = hit('#wave');
  if (wv) {
    const f = file(), r = wv.getBoundingClientRect();
    if (f) { f.at = f.sec * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); paintPlayer(); }
    return;
  }
  /* Нажатие на реплику переводит звук к ней: проверить цитату на слух — одно
     нажатие, а не поиск места ползунком. */
  const sg = hit('.m-seg-row');
  if (sg) {
    const f = file(), s = segsOf(f)[+sg.dataset.seg] || segsOf(FILES[0])[+sg.dataset.seg];
    if (f && s) { f.at = Math.min(f.sec, s.sec); paintPlayer(); }
    return;
  }
  if (hit('#btnMark')) {
    const f = file(), cs = curSeg(f);
    if (cs < 0) { toast('Отмечать нечего — расшифровки пока нет'); return; }
    const added = toggleMark(f.id, cs);
    render(); toast(added ? 'Место отмечено — собрано во «Важном»' : 'Отметка снята', true);
    return;
  }
  const spd = hit('[data-speed]');
  if (spd) {
    M.speed = +spd.dataset.speed;
    if (M.sheet === 'player') { openSheet('player'); paintPlayer(); }
    else { closeSheet(); render(); }
    return;
  }

  /* --- поиск внутри записи --- */
  if (hit('[data-find]')) { M.findOpen = !M.findOpen; if (!M.findOpen) M.find = ''; M.tab = 'transcript'; render(); return; }
  if (hit('[data-findclose]')) { M.findOpen = false; M.find = ''; render(); return; }

  /* --- вкладки записи и формирование --- */
  const tab = hit('[data-tab]');
  if (tab) { M.tab = tab.dataset.tab; render(); return; }
  const gen = hit('[data-gen]');
  if (gen) {
    const kind = gen.dataset.gen;
    gen.disabled = true;
    setTimeout(() => { M.generated[M.fileId + ':' + kind] = true; render(); }, 900);
    return;
  }
  /* Шаблон для новых записей: тот же смысл, что «Применять по умолчанию» в
     настольном. Шторка остаётся открытой — человек видит, что переключатель
     встал, и сам решает, закрывать её или применить шаблон к этой записи. */
  const td = hit('[data-tpldefault]');
  if (td) {
    const name = td.dataset.tpldefault;
    M.tplDefault = M.tplDefault === name ? null : name;
    render();
    toast(M.tplDefault ? t('Новые записи будут разбираться шаблоном') + ' «' + name + '»'
                       : t('Шаблон по умолчанию снят'));
    return;
  }
  const at = hit('[data-addtpl]');
  if (at) {
    const f = file(), id = 'c' + Date.now().toString(36);
    if (M.screen !== 'note') { closeSheet(); toast('Откройте запись, чтобы применить шаблон'); return; }
    f.custom.push({ id, name: at.dataset.addtpl });
    M.tab = id; closeSheet(); render(); return;
  }

  /* --- порядок и шторки --- */
  const sh = hit('[data-sheet]');
  if (sh) {
    M.moveAfterCreate = sh.dataset.formid || null;
    openSheet(sh.dataset.sheet);
    return;
  }
  const sb = hit('[data-sortby]');
  if (sb) {
    if (M.sort === sb.dataset.sortby) M.sortDir = M.sortDir === 'asc' ? 'desc' : 'asc';
    else { M.sort = sb.dataset.sortby; M.sortDir = SORT[M.sort].dir; }
    closeSheet(); render(); return;
  }
  const mic = hit('[data-mic]');
  if (mic) {
    M.micSrc = mic.dataset.mic;
    closeSheet(); render();
    /* Выбран диктофон, а он молчит — говорим сразу, чем пишем на самом деле:
       это состояние, в котором сотрудник окажется чаще всего. */
    toast(micFallback()
      ? t('Диктофон не на связи — записывает микрофон телефона')
      : t('Источник записи:') + ' ' + t(M.micSrc), !micFallback());
    return;
  }

  /* --- вопрос по записям --- */
  const aq = hit('[data-askq]');
  if (aq) { M.ask = { ...M.ask, q: aq.dataset.askq, asked: true }; render(); return; }
  if (hit('#askGo')) { M.ask = { ...M.ask, q: $('#askQ').value, asked: true }; render(); return; }
  const af = hit('[data-askfolder]');
  if (af) { M.ask = { ...M.ask, folder: af.dataset.askfolder || null }; closeSheet(); render(); return; }
  const pr = hit('[data-person]');
  if (pr) { e.stopPropagation(); openSheet('person', pr.dataset.person); return; }
  const en = hit('.fm-ent');
  if (en) { openSheet('person', en.textContent.trim()); return; }

  /* --- шаблоны --- */
  const tp = hit('[data-tpl]');
  if (tp) { openSheet('tpl', tp.dataset.tpl); return; }
  if (hit('[data-newtpl]')) { openSheet('newtpl'); return; }
  /* Новая папка: цвет выбирается кружком, создание добавляет папку по-настоящему
     и, если пришли из перемещения записи, сразу переносит запись в неё. */
  const sw = hit('[data-swatch]');
  if (sw) {
    M.newFolderColor = +sw.dataset.swatch;
    const name = ($('#folderName') || {}).value || '';
    openSheet('newfolder');
    if ($('#folderName')) { $('#folderName').value = name; $('#folderSave').disabled = !name.trim(); }
    return;
  }
  if (hit('#folderSave')) {
    const name = $('#folderName').value.trim();
    if (!name) return;
    if (FOLDERS.some(f => f.name.toLowerCase() === name.toLowerCase())) {
      toast('Папка с таким названием уже есть'); return;
    }
    FOLDERS.push({ name, color: SWATCH[M.newFolderColor] });
    const moveId = M.moveAfterCreate;
    M.moveAfterCreate = null;
    if (moveId) {
      const f = FILES.find(x => x.id === moveId);
      if (f) f.folder = name;
    }
    closeSheet(); applyLang(); render();
    toast(moveId ? 'Папка создана, запись перемещена' : 'Папка создана', true);
    return;
  }
  if (hit('#tplSave')) {
    TEMPLATES.push({ t: $('#tplName').value.trim(), s: $('#tplWhat').value.trim() || t('Свой разбор записи.'),
      cat: 'Общие', uses: 0, author: 'Вы' });
    closeSheet(); toast('Шаблон создан', true); render(); return;
  }

  /* --- настройки --- */
  const tg = hit('[data-toggle]');
  if (tg) { M.tgl[tg.dataset.toggle] = !tg.classList.contains('is-on'); tg.classList.toggle('is-on'); return; }
  if (hit('[data-passwd]')) { toast(t('Ссылка для смены пароля отправлена на') + ' a.ralovets@infomaximum.com'); return; }
  if (hit('[data-askmore]')) { toast('Заявка на расширение лимита отправлена администратору'); return; }
  if (hit('[data-getapp]')) { toast('Установщик скачивается с сервера организации'); return; }
  const tpc = hit('[data-topic]');
  if (tpc) { $('#supMsg').value = tpc.dataset.topic; $('#supMsg').focus(); return; }
  if (hit('[data-supsend]')) {
    const v = ($('#supMsg') || {}).value || '';
    if (!v.trim()) { toast('Опишите вопрос — иначе отправлять нечего'); return; }
    $('#supMsg').value = ''; toast('Приняли обращение. Ответим в рабочие часы, обычно за 15 минут.'); return;
  }
});

/* ПРОКРУТКА ПОЛОС РУКОЙ. На телефоне чипсы и вкладки прокручивают пальцем —
   это нативная прокрутка, её не трогаем. В прототипе на компьютере руки нет, а
   колесо мыши крутит страницу вертикально, поэтому полосу тянут МЫШЬЮ: так
   показ ведёт себя как приложение, а не как веб-страница со скроллбаром.
   Перетаскивание мышью и только мышью; палец идёт нативным путём. */
let strip = null, stripDragged = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button) return;
  const el = e.target.closest('.m-segs');
  if (!el || el.scrollWidth <= el.clientWidth) return;
  strip = { el, x: e.clientX, from: el.scrollLeft, moved: 0 };
});
document.addEventListener('pointermove', e => {
  if (!strip) return;
  const dx = e.clientX - strip.x;
  strip.moved = Math.max(strip.moved, Math.abs(dx));
  /* Порог, ниже которого это ещё нажатие, а не перетаскивание: без него дрожание
     руки на нажатии чипса съедало бы само нажатие. */
  if (strip.moved > 4) { strip.el.scrollLeft = strip.from - dx; e.preventDefault(); }
});
document.addEventListener('pointerup', () => {
  if (strip && strip.moved > 4) stripDragged = true;
  strip = null;
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { M.q = e.target.value; render(); }
  if (e.target.id === 'findQ') { M.find = e.target.value; render(); }
  if (e.target.id === 'askQ') M.ask.q = e.target.value;
  if (e.target.id === 'tplName') $('#tplSave').disabled = !e.target.value.trim();
  if (e.target.id === 'folderName') $('#folderSave').disabled = !e.target.value.trim();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'askQ') { M.ask.asked = true; render(); }
  if (e.key === 'Escape' && M.sheet) closeSheet();
});

/* Плашка прототипа рисуется из состояния, как и экран: иначе переключатель
   показывает не то, что включено. Владелец подсветки один — эта функция. */
function paintPlaque() {
  document.querySelectorAll('#langSwitch button').forEach(b =>
    b.classList.toggle('is-on', b.dataset.setlang === LANG));
  document.querySelectorAll('#orgSwitch button').forEach(b =>
    b.classList.toggle('is-on', b.dataset.orgmode === ORG.mode));
  document.querySelectorAll('#profSwitch button').forEach(b =>
    b.classList.toggle('is-on', b.dataset.hintprof === ORG.hintProfile));
  document.querySelectorAll('#permSwitch button').forEach(b =>
    b.classList.toggle('is-on', !!ORG[b.dataset.orgtoggle]));
}

/* ============================== ЗАПУСК ==================================== */
(function () {
  const q = new URLSearchParams(location.search);
  setOs(q.get('os') || 'ios');
  if (q.get('lang')) setLang(q.get('lang'));
  if (q.get('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
  if (q.get('screen')) M.screen = q.get('screen');
  if (q.get('scope')) { M.scope = { kind: q.get('scope'), value: q.get('value') || null }; M.screen = 'files'; }
  if (q.get('file') && FILES.some(f => f.id === q.get('file'))) { M.fileId = q.get('file'); M.screen = 'note'; }
  if (q.get('tab')) M.tab = q.get('tab');
  if (q.get('find')) { M.find = q.get('find'); M.findOpen = true; M.tab = 'transcript'; }
  if (q.get('at')) { const f = FILES.find(x => x.id === M.fileId); if (f) f.at = Math.max(0, Math.min(f.sec, +q.get('at'))); }
  if (q.get('mark')) { const f = FILES.find(x => x.id === M.fileId); if (f) M.marks[f.id] = String(q.get('mark')).split(',').map(Number); }
  if (q.get('set')) { M.setPane = q.get('set'); M.screen = 'set'; }
  /* Состояния продукта ссылкой: без них ни показать их, ни проверить нельзя. */
  if (q.get('org')) ORG.mode = q.get('org') === 'mandatory' ? 'mandatory' : 'assistant';
  if (q.get('profile') && HINT_PROFILES.some(x => x.id === q.get('profile'))) ORG.hintProfile = q.get('profile');
  if (q.get('link') === 'off') LINK.live = false;
  if (q.get('disk') === 'full') DISK.freeMin = 12;
  if (q.get('dev') === 'off') DEVICES.forEach(d => { d.link = 'off'; });
  if (q.get('mic')) M.micSrc = q.get('mic');
  if (q.get('q')) { M.q = q.get('q'); M.screen = 'search'; }
  paintPlaque();
  render();
  /* ?rec=on — идущая запись, ?rec=auto — она же, начатая автостартом;
     ?hints=N — сколько подсказок уже пришло (для показа и проверок). */
  if (q.get('rec')) {
    recStart(q.get('rec') === 'auto' ? (OS === 'android' ? 'звонок в Teams' : 'напоминание о встрече') : null);
    /* `?rec=saved` — экран «запись сохранена». Без своего адреса он оставался
       вне проверок: URL у него не было, а руками до него доходят не всегда. */
    if (q.get('rec') === 'saved') {
      /* Сохранённая запись должна выглядеть настоящей: сначала «прозвучало»
         несколько реплик, потом остановка. Иначе на экране 00:01 и пустой текст. */
      M.rec.lines = REC_SRC().slice(0, 8).map((x, i) =>
        ({ who: x.who, role: x.role, text: x.text, at: (i + 1) * REC_STEP }));
      M.rec.sec = M.rec.lines.length * REC_STEP;
      recStop(); render();
    }
    if (q.get('hints')) {
      const lines = linesForHints(ORG.hintProfile, +q.get('hints') || 0);
      M.rec.lines = REC_SRC().slice(0, lines).map((x, i) =>
        ({ who: x.who, role: x.role, text: x.text, at: (i + 1) * REC_STEP }));
      M.rec.sec = M.rec.lines.length * REC_STEP;
      M.rec.hints = hintsLive() ? hintsAfter(ORG.hintProfile, M.rec.lines.length) : [];
      render();
    }
  }
  /* Шторка открывается ПОСЛЕДНЕЙ: она рисуется из состояния, и до сборки
     записи список подсказок в ней был бы пуст. */
  if (q.get('sheet')) openSheet(q.get('sheet'), q.get('sheetid') || (q.get('file') || 'demo'));
  window.__fmDiag.ran = true;
})();
</script>
