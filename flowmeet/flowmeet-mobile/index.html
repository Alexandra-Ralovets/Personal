<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowMeet · прототип мобильного приложения</title>

<script>
/* ДИАГНОСТИКА ЗАГРУЗКИ. Ставится ДО стилей и основного скрипта: если скрипт не
   исполнился, страница выглядит просто недогруженной, а плашка называет причину. */
window.__fmDiag = { err: null, ran: false };
(function () {
  function banner(title, detail) {
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99999;'
      + 'padding:12px 16px;background:#fff1f0;border-bottom:1px solid #ffa39e;'
      + 'color:#a8071a;font:14px/20px system-ui,sans-serif');
    d.innerHTML = '<strong>' + title + '</strong><br><span style="color:#595959">' + detail + '</span>';
    (document.body || document.documentElement).appendChild(d);
  }
  window.__fmBanner = banner;
  window.addEventListener('error', function (e) {
    if (window.__fmDiag.err) return;
    window.__fmDiag.err = e;
    banner('Скрипт страницы не выполнился — интерфейс не собрался',
      (e.message || 'ошибка') + ' · ' + (e.filename || '') + ':' + (e.lineno || ''));
  }, true);
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      if (window.__fmDiag.ran || window.__fmDiag.err) return;
      banner('Скрипт страницы не запустился',
        'Разбор дошёл до конца, но код не выполнился. Обычно это блокировка встроенных'
        + ' скриптов расширением браузера или политикой.');
    }, 1500);
  });
})();
</script>

<link rel="stylesheet" href="ds-core-tokens.css">

<style>
/* ============================================================================
   МОБИЛЬНЫЙ ПРОТОТИП FlowMeet — ВЫБРОС.

   ЦВЕТ, РАДИУСЫ И ШРИФТ — из корпоративного канона Proceset Mini Apps
   (токены `ds-core-tokens.css`, симлинк на файл-владелец в скилле miniapp-ui).
   Литералов цвета нет.

   КЕГЛЬ И РИТМ — мобильные, и это ЧЕТВЁРТОЕ сознательное отклонение от канона:
   канон писан под веб, там базовый текст 14px и плотные строки. На телефоне так
   нельзя — интерфейс читается как уменьшенная веб-страница, а не как приложение.
   Поэтому здесь своя шкала (.m-*): базовый текст 17, вторичный 15, подпись 13,
   крупный заголовок экрана 34 — как в системных приложениях телефона. Семейство
   и насыщенности — канонические.

   Отклонения от канона, все сознательные (он писан под mini-app в портале):
   1. Нижняя панель навигации — в вебе канон её не описывает, на телефоне это
      главный навигатор.
   2. Своя верхняя панель экрана с крупным заголовком.
   3. Шторки снизу вместо модальных окон.
   4. Мобильная шкала кегля и ритма (см. выше).

   Соответствие компонентам antd подписано у блоков — карта переноса в код.
   ========================================================================== */

* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Roboto', system-ui, sans-serif;   /* служебная плашка вне корпуса */
  background: var(--bg-secondary); color: var(--text-primary);
  display: flex; flex-direction: row; align-items: flex-start; justify-content: center;
  min-height: 100vh; padding: var(--size-6x) var(--size-4x) var(--size-10x);
  gap: var(--size-4x);
}
.fm-stage {
  flex: 0 1 auto; min-width: 0;
  display: flex; flex-direction: column; align-items: center;
}
.fm-map {
  flex: 0 0 272px; width: 272px; max-height: calc(100vh - var(--size-8x));
  overflow: auto; position: sticky; top: var(--size-4x);
  padding: var(--padding-l);
  background: var(--bg-container);
  border: 1px solid var(--line-border); border-radius: var(--radius-l);
}
.fm-map__h { margin: var(--size-4x) 0 var(--space-s); color: var(--text-complimentary); }
.fm-map__row {
  display: flex; align-items: center; gap: var(--space-m); width: 100%;
  min-height: var(--size-8x); padding: var(--padding-s) var(--padding-m);
  margin: 0 0 var(--size-1x); border: none; border-radius: var(--radius-m);
  background: transparent; color: var(--text-primary); font-family: inherit;
  text-align: left; cursor: pointer;
}
.fm-map__row:hover { background: var(--bg-container-hover); }
.fm-map__name { flex: 1 1 auto; min-width: 0; }
.fm-map__row .fm-tag { flex: 0 0 auto; }

/* ─── Мобильная шкала текста. Только размеры и насыщенность; семейство и цвет
       канонические. ─────────────────────────────────────────────────────────── */
.m-large   { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -.4px; }
.m-title   { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.2px; }
.m-head    { font-size: 17px; line-height: 22px; font-weight: 600; }
.m-body    { font-size: 17px; line-height: 24px; font-weight: 400; }
.m-sub     { font-size: 15px; line-height: 20px; font-weight: 400; }
.m-cap     { font-size: 13px; line-height: 18px; font-weight: 400; }
.m-tiny    { font-size: 11px; line-height: 13px; font-weight: 500; }
.m-num     { font-variant-numeric: tabular-nums; }
/* Пометка «это ДАННЫЕ, а не интерфейс»: названия записей и папок остаются на
   языке разговора, и проверка языка их не считает непереведённой строкой. */
.m-data    { }
 /* Приглушённый текст ОДИН на прототип: у канона читаемая вторичная ступень
       одна (--text-complimentary, замерено 7,0:1 и 8,96:1), а --text-secondary
       и --text-hint дают 3,4:1 и 1,8:1 — ниже нормы для подписи. Второго класса
       приглушённого больше нет: он был бы дублем с тем же цветом. */
.m-dim     { color: var(--text-complimentary); }

/* Плашка над телефоном — служебная, к продукту не относится. */
.fm-plaque {
  display: flex; align-items: center; gap: var(--space-l); flex-wrap: wrap;
  justify-content: center; margin-bottom: var(--size-5x); padding: 0 var(--padding-l);
  color: var(--text-complimentary); font-size: 13px;
}
.fm-plaque__tag {
  padding: 2px var(--padding-m); border-radius: var(--radius-m);
  background: var(--tag-orange-bg); color: var(--tag-orange-text);
}
.fm-plaque__switch { display: flex; gap: var(--space-xs); }
.fm-plaque__switch button {
  padding: var(--padding-s) var(--padding-l); border-radius: var(--radius-m);
  border: 1px solid var(--line-border); background: var(--bg-container);
  font-family: inherit; font-size: 13px; color: var(--text-complimentary); cursor: pointer;
}
.fm-plaque__switch button.is-on { background: var(--primary-bg); color: var(--primary-active); border-color: var(--primary-border); }
.fm-plaque__legend { width: 100%; text-align: center; color: var(--text-hint); }

/* ─────────────────────────── КОРПУС ТЕЛЕФОНА ─────────────────────────────── */
/* Семейство шрифта — платформенное: у Apple системный San Francisco, у Google
   Roboto. В контейнере нет ни того, ни другого, поэтому проверять кегль надо
   относительными величинами, а не по пикселю в рендере. */
[data-os="ios"] { font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; }
[data-os="android"] { font-family: 'Roboto', system-ui, sans-serif; }

.fm-phone {
  width: 393px; height: 852px; flex: 0 0 auto; position: relative;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-secondary); color: var(--text-primary);
  /* Рамка корпуса — графит в обеих темах: это предмет, а не поверхность
     интерфейса, и «инверсный» токен в тёмной делал её белой. */
  border: 12px solid var(--neutral-120); border-radius: 56px;
  box-shadow: var(--shadow-3);
}
/* ПОЛОС ПРОКРУТКИ В ПРИЛОЖЕНИИ НЕ БЫВАЕТ — прокручивают рукой: пальцем на
   телефоне, перетаскиванием мыши в прототипе. Правило ОДНО на весь корпус, а не
   по одному у каждой полосы: тогда новая прокручиваемая полоса не может вернуть
   полосу прокрутки. Скрытие задаётся ДВУМЯ способами — стандартное свойство не
   работает в старых webkit, а webkit-псевдоэлемент не работает в Firefox, и
   именно из-за этого полоса под чипсами была видна. */
.fm-phone, .fm-phone * { scrollbar-width: none; -ms-overflow-style: none; }
.fm-phone::-webkit-scrollbar, .fm-phone *::-webkit-scrollbar { width: 0; height: 0; display: none; }

/* Строка состояния с вырезом: время слева, вырез по центру, значки справа. */
.fm-status {
  flex: 0 0 auto; height: 54px; display: flex; align-items: center;
  padding: 0 var(--size-8x); position: relative; z-index: 5;
  background: var(--bg-secondary);
}
.fm-status__time { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
.fm-status__spacer { flex: 1 1 auto; }
.fm-status__icons { display: flex; align-items: center; gap: 5px; }
.fm-island {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
  width: 118px; height: 34px; border-radius: 20px; background: var(--neutral-130);
}

/* ─── Верхняя панель. Действия закреплены, крупный заголовок уезжает вместе с
       содержимым и оставляет после себя компактный (antd: <NavBar>). ───────── */
.m-nav {
  flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-xs);
  min-height: 44px; padding: 0 var(--space-m); background: var(--bg-secondary);
  position: relative; z-index: 4;
}
.m-nav__compact {
  flex: 1 1 auto; min-width: 0; text-align: center; padding: 0 var(--space-xs);
  opacity: 0; transition: opacity .18s cubic-bezier(.4,0,.2,1);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.m-nav.is-scrolled { border-bottom: .5px solid var(--line-divider); }
.m-nav.is-scrolled .m-nav__compact { opacity: 1; }
.m-nav__acts { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.m-large-block { padding: var(--space-xs) var(--size-5x) var(--size-3x); background: var(--bg-secondary); }
.m-large-block .m-sub { margin-top: 2px; }

.m-scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.m-scroll--doc { background: var(--bg-container); }      /* текст записи — на белом */
.m-pad { padding: 0 var(--size-5x); }
.m-bottom { height: var(--size-20x); }                 /* воздух над нижней панелью */
/* На экранах с плавающей кнопкой записи воздуха нужно больше: иначе последняя
   строка списка навсегда остаётся под кнопкой. */
.m-scroll--fab .m-bottom { height: 140px; }

/* ─── Нижняя панель навигации (antd: <TabBar>). ──────────────────────────── */
.m-tabbar {
  flex: 0 0 auto; display: flex; align-items: flex-end; gap: 0;
  padding: var(--space-m) var(--space-xs) var(--size-6x);
  background: var(--bg-container); border-top: .5px solid var(--line-divider);
}
.m-tabbar button {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 4px; min-height: 48px; padding: var(--space-xs) 0 0; border: none; background: none;
  font-family: inherit; font-size: 11px; font-weight: 500; color: var(--text-complimentary); cursor: pointer;
}
.m-tabbar button.is-on { color: var(--primary-base); }

/* Кнопка записи — ПЛАВАЮЩАЯ НАД панелью разделов, а не внутри неё: по Apple HIG
   («Tab bars», июнь 2026) панель разделов служит навигации и действий в себе не
   держит — «Use a tab bar to support navigation, not to provide actions».
   Приём взят у Apple Mail: круглая кнопка действия в правом нижнем углу над
   панелью. Показывается только там, где действие уместно — в списке записей. */
.m-fab {
  position: absolute; right: var(--size-5x); bottom: 100px; z-index: 30;
  width: 62px; height: 62px; border: none; border-radius: 50%;
  background: var(--primary-base); color: var(--text-contrast);
  display: grid; place-items: center; box-shadow: var(--shadow-2); cursor: pointer;
}
.m-fab:active { background: var(--primary-active); }

/* Аксессуар, прикреплённый к панели разделов — HIG «tab bar with an attached
   accessory», как мини-плеер в Музыке. Панель разделов при этом ОСТАЁТСЯ
   видимой: скрывать её HIG запрещает («If you hide the tab bar, people can
   forget which area of the app they're in»), исключение только у модального
   экрана — им у нас идёт запись встречи. */
.m-acc { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-l);
  padding: var(--space-m) var(--size-5x); background: var(--bg-container);
  border-top: .5px solid var(--line-divider); cursor: pointer; }
.m-acc .m-wave { flex: 1 1 auto; height: 28px; }
.m-acc__side { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-m); }
.m-play--mini { width: 44px; height: 44px; }

/* ─────────────────────────── ЭЛЕМЕНТЫ ──────────────────────────────────── */
.fm-i { width: 22px; height: 22px; flex: 0 0 auto;
        stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.fm-i--s { width: 17px; height: 17px; }
.fm-i--l { width: 28px; height: 28px; }
.fm-i--xl { width: 56px; height: 56px; stroke-width: 1; }
.fm-i--tab { width: 26px; height: 26px; }

.fm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-m);
  min-height: 48px; padding: 0 var(--size-6x); border-radius: var(--radius-l);
  border: 1px solid var(--line-border); background: var(--bg-container);
  font-family: inherit; font-size: 17px; font-weight: 500; color: var(--text-primary); cursor: pointer;
}
.fm-btn:active { background: var(--bg-container-active); }
.fm-btn--primary { background: var(--primary-base); border-color: var(--primary-base); color: var(--text-contrast); }
.fm-btn--primary:active { background: var(--primary-active); }
/* Разрушительное действие несёт цвет опасности, а не цвет главного действия
   (28.08.2026): удаление записи без возврата стояло бирюзовой праймари, то есть
   выглядело рекомендуемым. Токены канона, литералов нет. */
.fm-btn--danger { background: var(--danger-base); border-color: var(--danger-base); color: var(--text-contrast); }
.fm-btn--danger:active { background: var(--danger-active); border-color: var(--danger-active); }
.fm-btn--text { background: none; border-color: transparent; color: var(--primary-base); min-height: 44px; padding: 0 var(--space-m); }
.fm-btn--icon { width: 44px; min-height: 44px; padding: 0; color: var(--primary-base);
  background: none; border-color: transparent; }
/* Порядок важен: у значка-кнопки заливка снята, поэтому основной цвет
   возвращаем явно — иначе «Спросить» выглядит как голая стрелка. */
.fm-btn--icon.fm-btn--primary { background: var(--primary-base); border-color: var(--primary-base);
  color: var(--text-contrast); border-radius: var(--radius-l); }
.fm-btn--block { width: 100%; }
.fm-btn--sm { min-height: 36px; padding: 0 var(--padding-l); font-size: 15px; }
.fm-btn[disabled] { opacity: .35; pointer-events: none; }

.fm-input {
  width: 100%; min-height: 48px; padding: 0 var(--padding-l);
  border: 1px solid var(--line-border); border-radius: var(--radius-l);
  background: var(--bg-container); color: var(--text-primary);
  font-family: inherit; font-size: 17px;
}
.fm-input:focus { outline: none; border-color: var(--primary-base); box-shadow: var(--shadow-focus-primary); }
.fm-textarea { width: 100%; min-height: 104px; padding: var(--padding-l); border: 1px solid var(--line-border);
  border-radius: var(--radius-l); background: var(--bg-container); color: var(--text-primary);
  font-family: inherit; font-size: 17px; resize: vertical; }
/* Поле поиска в мобильном виде: заливка вместо рамки, значок внутри. */
.m-searchwrap { position: relative; display: flex; align-items: center; }
.m-searchwrap .fm-i { position: absolute; left: var(--padding-l); color: var(--text-icon); pointer-events: none; }
.m-searchwrap .fm-input {
  padding-left: calc(var(--padding-l) + 22px + var(--space-m));
  background: var(--bg-container); border-color: transparent;   /* на серой подложке заливка белая */
}

.fm-tag { display: inline-flex; align-items: center; gap: var(--space-xs);
  padding: 1px var(--padding-s); border-radius: var(--radius-m); background: var(--bg-container-secondary);
  color: var(--text-complimentary); font-size: 13px; line-height: 18px; white-space: nowrap; }
.fm-tag--green { background: var(--positive-bg); color: var(--positive-base); }
.fm-tag--orange { background: var(--tag-orange-bg); color: var(--tag-orange-text); }
.fm-tag--cyan { background: var(--tag-cyan-bg); color: var(--tag-cyan-text); }

/* ─── Группа строк: скруглённая вставка с воздухом по бокам, разделители не
       на всю ширину, а от текста (antd: <List> inset). ──────────────────── */
.m-group {
  margin: 0 var(--size-5x) var(--size-5x); border-radius: var(--radius-l);
  background: var(--bg-container); overflow: hidden;
}
/* Заголовок группы: основной цвет и насыщенность, а не приглушённый серый —
   канонический вторичный на подложке экрана замерен в 2,09:1 (тёмная тема). */
.m-grouphead { padding: var(--space-m) var(--size-5x) var(--space-m); color: var(--text-complimentary); font-weight: 600; }

.m-row {
  display: flex; align-items: center; gap: var(--space-l); width: 100%; text-align: left;
  min-height: 60px; padding: var(--space-m) var(--padding-l); border: none;
  background: none; font-family: inherit; color: var(--text-primary); cursor: pointer;
}
.m-row:active { background: var(--bg-container-hover); }
.m-row + .m-row { box-shadow: inset 0 .5px 0 var(--line-divider); }
.m-row--inset + .m-row--inset { box-shadow: none; }
/* Разделитель внутри группы начинается от текста, а не от края: у строки без
   значка это отступ группы, у строки со значком — плюс сам значок. */
.m-row--inset { position: relative; --m-inset: var(--padding-l); }
.m-row--inset:has(.m-row__ico) { --m-inset: calc(var(--padding-l) + 22px + var(--space-l)); }
.m-row--inset + .m-row--inset::before {
  content: ""; position: absolute; left: var(--m-inset); right: 0; top: 0;
  height: .5px; background: var(--line-divider);
}
.m-row__body { flex: 1 1 auto; min-width: 0; }
.m-row__title { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
/* У строки со значением справа подпись держится в одну строку: иначе длинная
   подпись переносится и строка становится вдвое выше соседних. Обратная
   сторона — обрезка, поэтому подписи таких строк держим короткими. */
.m-row:has(.m-row__val) .m-row__title { -webkit-line-clamp: 1; }
/* Подпись строки настройки лежит прямо в теле строки, без отдельного класса —
   поэтому в одну строку её держим по телу. */
.m-row:has(.m-row__val) > .m-row__body { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-row__meta { display: flex; align-items: center; gap: var(--space-m); margin-top: 3px;
  color: var(--text-complimentary); white-space: nowrap; overflow: hidden; }
/* Превью содержания записи: строка списка обязана нести смысл, а не только
   метаданные — иначе список читается как каталог файлов, а не как содержание.
   Две строки, дальше обрезка: строка списка не должна расти выше соседних. */
.m-row__prev { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; margin-top: 3px; color: var(--text-complimentary); }
.m-row__prev--wait { color: var(--text-complimentary); display: flex; align-items: center; gap: var(--space-m); }
.m-row__prev--wait .fm-i { animation: fm-spin 1.1s linear infinite; }
/* Длинную подпись (профиль с лимитом) пускаем в две строки. */
.m-row__meta--wrap { white-space: normal; overflow: visible; }
.m-row__dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.m-row__act { flex: 0 0 auto; width: 44px; min-height: 44px; display: grid; place-items: center;
  color: var(--text-icon); border: none; background: none; cursor: pointer; border-radius: 50%; }
.m-row__act:active { background: var(--bg-icon-hover); }
.m-row__chev { flex: 0 0 auto; color: var(--text-icon-disabled); }
.m-row__ico { flex: 0 0 auto; color: var(--primary-base); }
.m-row__val { flex: 0 1 auto; min-width: 0; color: var(--text-complimentary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Элемент управления в строке (переключатель, кнопка, метка) не сжимается и не
   обрезается: в обрезающей обёртке кнопка перестаёт принимать нажатие в центр. */
.m-row__right { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-m); }
/* Точка-разделитель в подписи строки: цвет линии давал 1,41:1 и точка просто
   не читалась — берём ту же ступень, что и сама подпись. */
.m-sep { color: var(--text-complimentary); }

/* Найденное место: цитата со своим временем; нажатие уводит прямо в это место
   записи, а не просто «в запись». */
.m-hitrow { display: flex; align-items: flex-start; gap: var(--space-l); width: 100%; text-align: left;
  padding: var(--space-m) var(--padding-l); border: none; background: none;
  font-family: inherit; color: var(--text-primary); cursor: pointer;
  box-shadow: inset 0 .5px 0 var(--line-divider); }
.m-hitrow:active { background: var(--bg-container-hover); }
.m-hitrow .m-time { flex: 0 0 auto; padding-top: 2px; }
.m-hitrow__txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; color: var(--text-complimentary); }

.m-empty { display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--size-20x) var(--size-8x); color: var(--text-complimentary); }
.m-empty__icon { color: var(--text-icon-disabled); margin-bottom: var(--size-5x); }
.m-empty h2 { margin: 0 0 var(--space-m); color: var(--text-primary); }
.m-empty p { margin: 0; max-width: 260px; }

/* Кружок с инициалами владельца пространства. Инициалы — данные учётной
   записи, поэтому у них свой класс: проверка языка по нему понимает, что это
   не строка интерфейса. */
.m-avatar { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto;
  background: var(--primary-bg); color: var(--primary-active); display: grid; place-items: center; }

/* Кружок цвета папки: выбранный несёт обводку, а не галочку внутри — на цветном
   круге галочка теряется. */
.m-swatch { width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent;
  box-shadow: inset 0 0 0 2px var(--bg-container); cursor: pointer; }
.m-swatch.is-on { border-color: var(--text-primary); }

.m-toggle { width: 51px; height: 31px; border-radius: 31px; flex: 0 0 auto;
  border: none; background: var(--bg-rail); position: relative; cursor: pointer; }
.m-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
  border-radius: 50%; background: var(--bg-container); box-shadow: var(--shadow-1);
  transition: transform .18s cubic-bezier(.4,0,.2,1); }
.m-toggle.is-on { background: var(--primary-base); }
.m-toggle.is-on::after { transform: translateX(20px); }

/* ─────────────────── ПРОИГРЫВАТЕЛЬ — ПОЛОСА ВНИЗУ ЭКРАНА ───────────────────
   Жанровое решение голосовых блокнотов: главное на экране записи — текст, а не
   пульт, поэтому звук живёт тонкой полосой в нижней зоне большого пальца и
   занимает место нижней панели разделов (на вложенном экране она уходит).
   Разбор жанра — ../interfeys-golosovyh-bloknotov-razbor.2026-08-27.md */
.m-pbar { flex: 0 0 auto; padding: var(--space-m) var(--size-5x) var(--size-6x);
  background: var(--bg-container); border-top: .5px solid var(--line-divider); }
.m-times { display: flex; justify-content: space-between; margin-top: 2px; color: var(--text-complimentary); }
.m-ctrls { display: flex; align-items: center; gap: var(--space-m); margin-top: var(--space-m); }
.m-ctrls__gap { flex: 1 1 auto; }
.m-play { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%;
  border: none; background: var(--primary-base); color: var(--text-contrast); cursor: pointer; flex: 0 0 auto; }
.m-play:active { background: var(--primary-active); }
.m-seek { width: 44px; height: 44px; display: grid; place-items: center; border: none; background: none;
  color: var(--text-primary); cursor: pointer; border-radius: 50%; flex: 0 0 auto; }
.m-seek:active { background: var(--bg-icon-hover); }
/* Закладка в проигрывателе: горит, когда звучащее место уже отмечено. */
#btnMark.is-on { color: var(--tag-orange-text); }
.m-speed.is-on { background: var(--primary-bg); color: var(--text-primary); font-weight: 600; }
.m-speed { min-height: 36px; padding: 0 var(--padding-m); flex: 0 0 auto;
  border-radius: var(--radius-m); border: none; background: var(--bg-container-secondary);
  font-family: inherit; font-size: 15px; font-variant-numeric: tabular-nums;
  color: var(--text-primary); cursor: pointer; }

/* ─── Волна вместо линии прогресса: видно, где говорили, а где молчали.
       Нажатие в любое место волны переводит звук туда. Высоты полос выведены из
       номера записи — при каждом открытии волна одна и та же. ─────────────── */
.m-wave { display: flex; align-items: center; gap: 2px; height: 36px; cursor: pointer; }
.m-wave span { flex: 1 1 0; border-radius: 1.5px; background: var(--bg-rail); }
.m-wave span.is-played { background: var(--primary-base); }
/* Отмеченное место видно на волне засечкой сверху — как в жанре: отметил на
   слух, потом находишь глазами. */
.m-wave span.is-marked { background: var(--tag-orange-text); }

/* Шапка открытой записи: крупный заголовок уезжает с содержимым (HIG: large
   title), поэтому область заголовка в панели остаётся пустой, пока не начнут
   прокручивать, — обрезка названия тремя буквами уходит. */
.m-notehead { padding: var(--space-m) var(--size-5x) var(--size-4x); background: var(--bg-container); }

/* Сегменты вкладок записи (antd: <Segmented>). Закреплены под панелью: в
   часовой расшифровке вкладку иначе не переключить, не прокрутив наверх. */
.m-segsrow { position: sticky; top: 0; z-index: 3; flex: 0 0 auto; background: var(--bg-container);
  border-bottom: .5px solid var(--line-divider); overflow: hidden; }
.m-segsrow::after {
  content: ""; position: absolute; right: 0; top: 0; bottom: 1px; width: var(--size-8x);
  background: linear-gradient(90deg, transparent, var(--bg-container)); pointer-events: none;
}
.m-segs { display: flex; gap: var(--space-m); overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding: var(--space-m) var(--size-8x) calc(var(--space-m) + 24px) var(--size-5x);
  margin-bottom: -24px; }
.m-seg-btn { flex: 0 0 auto; min-height: 36px; padding: 0 var(--padding-l); border-radius: var(--radius-l);
  border: none; background: none;
  font-family: inherit; font-size: 15px; color: var(--text-complimentary); cursor: pointer; }
/* Выбранную вкладку показывает заливка, а не цвет подписи: бирюзовая подпись на
   бирюзовой заливке замерена в 2,20:1 (тёмная тема), а серая подпись на серой
   заливке неактивной — в 2,09:1. Сняли обе пары. */
.m-seg-btn.is-on { background: var(--primary-bg); color: var(--text-primary); font-weight: 600; }

/* Расшифровка: реплика как высказывание, а не строка таблицы. Текст и звук
   сшиты — звучащая реплика подсвечена, нажатие на реплику переводит звук к ней.
   Роль «сейчас звучит» несут заливка и полоса слева, а текст остаётся
   основным: в тёмной теме основной цвет темнее, и текст на светлой заливке
   пропадает (проверено замером контраста по канону). */
.m-seg-row { position: relative; padding: var(--space-m) var(--size-5x);
  margin-bottom: var(--size-3x); border-radius: var(--radius-l); cursor: pointer; }
.m-seg-row:active { background: var(--bg-container-hover); }
.m-seg-row.is-now { background: var(--primary-bg); }
.m-seg-row.is-now::before { content: ""; position: absolute; left: 6px; top: var(--space-m); bottom: var(--space-m);
  width: 3px; border-radius: 2px; background: var(--primary-base); }
/* На подсвеченной реплике имя «нашего» говорящего берёт основной цвет: бирюза
   на светлой заливке замерена в 2,20:1 (тёмная тема) — роль всё равно несут
   заливка и полоса слева. */
.m-seg-row.is-now .m-who--mine { color: var(--text-primary); }
.m-seg-row__head { display: flex; align-items: baseline; gap: var(--space-m); margin-bottom: 4px; }
.m-who { color: var(--text-primary); border: none; background: none; padding: 0;
  font-family: inherit; font-size: inherit; font-weight: inherit; cursor: pointer; }
.m-who--mine { color: var(--primary-active); }
/* Время реплики — вторичная подпись, но подпись: у --text-hint на белом
   замерено 1,84:1, это нечитаемо. */
.m-time { color: var(--text-complimentary); font-variant-numeric: tabular-nums; }
.m-seg-row p { margin: 0; }
.m-seg-row__mark { margin-left: auto; color: var(--tag-orange-text); }
/* Найденное слово в расшифровке. */
/* Найденное слово: роль несёт ЗАЛИВКА, текст остаётся основным. Пара
   «оранжевый текст на оранжевой заливке» замерена в 2,23:1. */
.m-hl { background: var(--tag-orange-bg); color: var(--text-primary); border-radius: 3px; }

/* Поиск внутри записи: часовая встреча без него нечитаема. */
.m-findbar { flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-m);
  padding: var(--space-m) var(--size-5x); background: var(--bg-container);
  border-bottom: .5px solid var(--line-divider); }
.m-findbar .m-searchwrap { flex: 1 1 auto; }
.m-findbar .fm-input { background: var(--bg-container-secondary); min-height: 40px; font-size: 15px; }

.m-doc { padding: 0 var(--size-5x) var(--size-8x); }
.m-doc h1 { font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.3px; margin: var(--size-6x) 0 var(--size-4x); }
.m-doc h2 { font-size: 19px; line-height: 25px; font-weight: 600; margin: var(--size-6x) 0 var(--space-m); }
.m-doc p, .m-doc ul, .m-doc ol { font-size: 17px; line-height: 25px; margin: 0 0 var(--size-4x); }
.m-doc ul, .m-doc ol { padding-left: var(--size-6x); }
.m-doc li { margin-bottom: var(--space-m); }
.m-doc strong { font-weight: 600; }
.fm-ent { color: var(--text-link); cursor: pointer; }

@keyframes fm-spin { to { transform: rotate(360deg); } }

/* ─────────────────────────── ЗАПИСЬ (полный экран) ─────────────────────────
   Строение жанровое: сверху состояние и счётчик, СЕРЕДИНУ занимает живая
   расшифровка (слова появляются по ходу речи — этим приложение доказывает, что
   слышит именно речь), внизу — волна и кнопки в зоне большого пальца. Раньше
   всё стояло по центру, а нижняя треть экрана пустовала. */
.m-rec {
  position: absolute; top: 54px; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; flex-direction: column; background: var(--bg-secondary);
}
.m-rec__top { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  gap: var(--space-xs); padding: var(--size-6x) var(--size-8x) var(--size-4x); text-align: center; }
.m-rec__head { display: flex; align-items: center; gap: var(--space-m); color: var(--text-complimentary); }
.m-rec__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger-base);
  animation: fm-blink 1.4s steps(1) infinite; }
@keyframes fm-blink { 50% { opacity: .2; } }
.m-rec__time { font-size: 48px; line-height: 1.05; font-weight: 300; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
/* Живая расшифровка. Последняя реплика — основным цветом, предыдущие уходят в
   серый: так видно, что текст идёт за речью, а не стоит списком. */
/* У верхнего края расшифровка растворяется: тогда обрезанная строка читается
   как «выше есть ещё», а не как дефект — тот же приём, что у прокручиваемых
   полос чипсов. */
.m-rec__live { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--size-5x);
  mask-image: linear-gradient(180deg, transparent, #000 var(--size-8x));
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 var(--size-8x)); }
.m-rec__line { margin: 0 0 var(--size-4x); color: var(--text-complimentary); }
.m-rec__line:last-child { color: var(--text-primary); }
.m-rec__line b { font-weight: 600; }
.m-rec__wait { display: flex; align-items: center; justify-content: center; gap: var(--space-m);
  height: 100%; color: var(--text-complimentary); text-align: center; }
/* Волна во всю ширину: тишина и речь различимы глазом, «прибор слышит». */
.m-level { display: flex; align-items: center; gap: 3px; height: 44px; width: 100%; }
.m-level span { flex: 1 1 0; border-radius: 2px; background: var(--primary-base); animation: m-lvl .9s ease-in-out infinite; }
@keyframes m-lvl { 0%, 100% { height: 8%; } 50% { height: 100%; } }
.m-rec__bottom { flex: 0 0 auto; padding: var(--size-4x) var(--size-8x) var(--size-8x);
  display: flex; flex-direction: column; align-items: center; gap: var(--size-4x); text-align: center; }
/* Кнопки в нижней зоне: остановка — крупная круглая, одной рукой не глядя. */
.m-rec__acts { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.m-rec__stop { width: 76px; height: 76px; border-radius: 50%; border: none; flex: 0 0 auto;
  background: var(--danger-base); color: var(--text-contrast); display: grid; place-items: center; cursor: pointer; }
.m-rec__stop:active { background: var(--danger-active); }
.m-rec__side { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 76px;
  border: none; background: none; font-family: inherit; font-size: 13px;
  color: var(--text-primary); cursor: pointer; padding: var(--space-m) 0; }
.m-rec__side .fm-i { color: var(--text-primary); }
.m-rec__side:disabled { opacity: .35; pointer-events: none; }
.m-rec__note { color: var(--text-complimentary); max-width: 280px; }
.m-rec__done { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: var(--size-6x); padding: var(--size-8x); text-align: center; }
.m-rec__done .fm-btn { min-width: 200px; }

/* ══════════════════════ ANDROID: ОБОЛОЧКА MATERIAL 3 ═══════════════════════
   Приложение выходит на двух ОС, поэтому оболочек ДВЕ, а не одна средняя:
   пользователь каждой платформы должен видеть привычные манеры. Структура
   (папки → записи → запись, разделы внизу, шторки, мини-плеер) общая — она от
   платформы не зависит; расходятся ФОРМА и поведение отдельных элементов.
   Ниже — только расхождения, по фактам первоисточников (m3.material.io):
   активный раздел несёт «пилюлю»-индикатор, кнопка действия — Medium FAB со
   скруглением, цель нажатия 48dp против 44pt у Apple, сообщения о результате —
   штатный снэкбар (в iOS такого элемента нет вовсе), список идёт во всю ширину
   без «карточек», скругления крупнее.
   ═══════════════════════════════════════════════════════════════════════════ */
[data-os="android"] { font-family: 'Roboto', system-ui, sans-serif; }

/* Активный раздел: подложка под значком, а не только цвет (M3 active indicator). */
[data-os="android"] .m-tabbar button { gap: 2px; }
[data-os="android"] .m-tabbar button .fm-i {
  padding: 4px 20px; border-radius: 16px; box-sizing: content-box; width: 26px; height: 26px;
}
[data-os="android"] .m-tabbar button.is-on .fm-i { background: var(--primary-bg); }
[data-os="android"] .m-tabbar button.is-on { color: var(--text-primary); font-weight: 600; }

/* Кнопка действия: Medium FAB — скруглённый квадрат, а не круг. */
[data-os="android"] .m-fab { width: 56px; height: 56px; border-radius: 16px; }

/* Список во всю ширину: «карточки» с воздухом по бокам — приём Apple. */
[data-os="android"] .m-group { margin-left: 0; margin-right: 0; border-radius: 0; }
[data-os="android"] .m-grouphead { font-weight: 500; }

/* Цель нажатия 48dp вместо 44pt. */
[data-os="android"] .fm-btn--icon,
[data-os="android"] .m-row__act,
[data-os="android"] .m-seek { width: 48px; min-height: 48px; height: 48px; }
[data-os="android"] .m-nav { min-height: 48px; }
[data-os="android"] .m-row { min-height: 64px; }
[data-os="android"] .fm-sheet__item { min-height: 60px; }
[data-os="android"] .m-swatch { width: 48px; height: 48px; }

/* Скругления крупнее: у M3 кнопки и поля почти капсульные, шторка — 28. */
[data-os="android"] .fm-btn, [data-os="android"] .fm-input,
[data-os="android"] .m-seg-btn, [data-os="android"] .m-speed { border-radius: 999px; }
[data-os="android"] .fm-sheet { border-radius: 28px 28px 0 0; }
[data-os="android"] .m-card, [data-os="android"] .m-askchips button { border-radius: 16px; }

/* Полоска системного жеста: в Android возврат и переход домой — системные, и
   пользователь ищет их у нижнего края, а не только в интерфейсе приложения. */
.m-sysbar { display: none; }
[data-os="android"] .m-sysbar {
  display: block; position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%);
  width: 108px; height: 4px; border-radius: 2px; background: var(--text-icon); z-index: 20;
}
[data-os="android"] .m-tabbar { padding-bottom: var(--size-8x); }

/* Сообщение о результате — снэкбар: прямоугольный, во всю ширину у нижнего
   края, слева текст. Всплывающая «пилюля» по центру — не Material. */
[data-os="android"] .fm-toast {
  left: var(--space-m); right: var(--space-m); transform: translateY(10px);
  max-width: none; border-radius: var(--radius-m); text-align: left;
}
[data-os="android"] .fm-toast.is-open { transform: translateY(0); }

/* ───────────────────────────── ШТОРКА СНИЗУ ──────────────────────────────── */
.fm-scrim {
  position: absolute; inset: 0; z-index: 50; display: flex; align-items: flex-end;
  background: var(--bg-mask); opacity: 0; pointer-events: none; transition: opacity .18s;
}
.fm-scrim.is-open { opacity: 1; pointer-events: auto; }
.fm-sheet {
  width: 100%; max-height: 82%; display: flex; flex-direction: column;
  background: var(--bg-float); border-radius: var(--radius-l) var(--radius-l) 0 0;
  transform: translateY(24px); transition: transform .2s cubic-bezier(.4,0,.2,1);
  padding-bottom: var(--size-8x);
}
.fm-scrim.is-open .fm-sheet { transform: translateY(0); }
.fm-sheet__grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-border);
  margin: var(--space-m) auto var(--space-xs); flex: 0 0 auto; }
.fm-sheet__head { padding: var(--space-m) var(--size-5x) var(--size-3x); }
.fm-sheet__body { overflow-y: auto; }
.fm-sheet__item { display: flex; align-items: center; gap: var(--size-4x); width: 100%; text-align: left;
  min-height: 56px; padding: var(--space-m) var(--size-5x); border: none; background: none;
  font-family: inherit; font-size: 17px; color: var(--text-primary); cursor: pointer; }
.fm-sheet__item:active { background: var(--bg-container-hover); }
.fm-sheet__item .fm-i:first-child { color: var(--primary-base); }
.fm-sheet__item.is-danger, .fm-sheet__item.is-danger .fm-i:first-child { color: var(--danger-base); }
.fm-sheet__foot { display: flex; gap: var(--size-3x); padding: var(--size-4x) var(--size-5x) 0; }
.fm-sheet__foot .fm-btn { flex: 1 1 0; }
.fm-check { margin-left: auto; color: var(--primary-base); }

/* Всплывающее сообщение (antd: <Toast>). */

   Подсказка в моменте, диктофоны, связь и очередь отправки. Только токены
   канона и мобильная шкала кегля (.m-*), как во всём файле. */

   НАД лентой речи: речь доказывает, что слышим, подсказка отвечает «что
   сказать сейчас». */
.m-hintbox { flex: 0 0 auto; padding: 0 var(--size-5x) var(--size-4x); }
.m-hint {
  display: block; width: 100%; text-align: left; font-family: inherit; cursor: pointer;
  padding: var(--size-4x); border-radius: var(--radius-l); border: 1px solid var(--primary-border);
  background: var(--primary-bg); color: var(--text-primary);

.m-hint__head { display: flex; align-items: center; gap: var(--space-m); margin-bottom: var(--space-xs); }

.m-hint__src { display: flex; align-items: center; gap: var(--space-xs); margin: var(--size-3x) 0 0; color: var(--text-complimentary); }

  position: absolute; top: var(--size-4x); right: var(--size-5x); z-index: 2;

/* ============================ ВЫБОРКИ ЭКРАНА ============================== */
function inScope(f, sc) {
  sc = sc || M.scope;
  if (sc.kind === 'search') return !f.deleted && matchQ(f, sc.value);
  if (sc.kind === 'trash') return !!f.deleted;
  if (f.deleted) return false;
  if (sc.kind === 'all') return true;
  if (sc.kind === 'unfiled') return !f.folder;
  if (sc.kind === 'folder') return f.folder === sc.value;
  if (sc.kind === 'src') return f.src === sc.value;
  return true;
}
const cnt = (kind, value) => FILES.filter(f => inScope(f, { kind, value: value || null })).length;
const rows = () => {
  const s = SORT[M.sort] || SORT.date, k = M.sortDir === 'asc' ? 1 : -1;
  return FILES.filter(f => inScope(f)).sort((a, b) => k * s.cmp(s.get(a), s.get(b)));
};
const file = () => FILES.find(f => f.id === M.fileId);
const isGen = (id, tab) => !!M.generated[id + ':' + tab];
const folderColor = name => (FOLDERS.find(x => x.name === name) || {}).color || 'var(--line-border)';
const scopeTitle = () => M.scope.kind === 'all' ? 'Все записи'
  : M.scope.kind === 'unfiled' ? 'Без папки' : M.scope.kind === 'trash' ? 'Корзина' : M.scope.value;

/* ─── Готовность записи и превью её содержания ──────────────────────────────
   Строка списка обязана нести смысл, а не только дату и длительность: иначе
   список читается как каталог файлов. Порядок источников превью — от разобранного
   к сырому: первый абзац конспекта, иначе первая реплика разговора. Пока
   расшифровки нет, превью не выдумываем — показываем состояние обработки. */
const hasSummary = f => !f.summaryEmpty || isGen(f.id, 'summary');
const hasTranscript = f => !f.transcriptEmpty || isGen(f.id, 'transcript');
const firstPara = html => {
  const m = /<p[^>]*>([\s\S]*?)<\/p>/.exec(String(html || ''));
  return m ? plain(m[1]).replace(/\s+/g, ' ').trim() : '';
};
function preview(f) {
  if (!hasTranscript(f)) return null;                       // ещё расшифровывается
  if (hasSummary(f)) { const s = firstPara(f.summary); if (s) return s; }
  const seg = (f.transcript || [])[0];
  return seg ? seg.who + ': ' + seg.text : '';
}

/* ─── Отметки на слух ───────────────────────────────────────────────────────
   Хранятся номерами реплик, а не текстом: реплика — единственное место записи,
   у которого есть время, значит по отметке можно перевести звук. */
const marksOf = id => M.marks[id] || [];
function toggleMark(id, seg) {
  const cur = marksOf(id), i = cur.indexOf(seg);
  M.marks[id] = i > -1 ? cur.filter(x => x !== seg) : cur.concat(seg).sort((a, b) => a - b);
  return i < 0;
}
/* Реплики записи в едином виде: время в секундах считаем один раз здесь, чтобы
   подсветка, переход по нажатию и отметки шли от одного и того же числа. */
const segsOf = f => (f.transcript && f.transcript.length ? f.transcript : [])
  .map((s, i) => ({ ...s, i, sec: hms(s.time) }));
const curSeg = f => {
  const at = posOf(f), ss = segsOf(f);
  for (let i = ss.length - 1; i >= 0; i--) if (ss[i].sec <= at) return i;
  return ss.length ? 0 : -1;
};

/* ─── Волна записи ─────────────────────────────────────────────────────────
   Высоты полос выведены из номера записи, поэтому волна у записи всегда одна и
   та же. Настоящей огибающей звука в прототипе нет и быть не может — важно, что
   волна показывает пройденное место и отметки, а не «красивую картинку». */
const WAVE_N = 58;
const waveAmp = (f, i) => {
  const s = String(f.id) + ':' + i;
  let h = 2166136261;                                  // целочисленный разброс, без плавающей точки
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = (h * 16777619) >>> 0; }
  return 18 + h % 82;
};
function waveHtml(f) {
  const at = posOf(f), pos = f.sec ? at / f.sec * WAVE_N : 0;
  const mk = new Set(marksOf(f.id).map(i => {
    const s = segsOf(f)[i];
    return s && f.sec ? Math.round(s.sec / f.sec * WAVE_N) : -1;
  }));
  return `<div class="m-wave" id="wave" role="slider" aria-label="${t('Перейти по записи')}">${
    Array.from({ length: WAVE_N }, (_, i) => `<span class="${i < pos ? 'is-played' : ''}${
      mk.has(i) ? ' is-marked' : ''}" style="height:${waveAmp(f, i)}%"></span>`).join('')}</div>`;
}

/* ============================== СООБЩЕНИЕ ================================= */
let toastTimer = null;
function toast(text, minor) {
  /* Изменение, которое человек видит на экране (запись переехала в папку,
     появилась закладка), у Apple не подтверждают: HIG просит подтверждать
     только существенное и предупреждать о потерях. У Material снэкбар о таком
     сообщать вправе — это его штатная роль. */
  if (OS !== 'android' && minor) return;
  const el = $('#toast');
  el.textContent = t(text); el.classList.add('is-open');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-open'), 2600);
}

/* ============================== ПАНЕЛЬ И ЭКРАНЫ ===========================
   Строение экрана мобильное: закреплённая тонкая панель с действиями, крупный
   заголовок ВНУТРИ прокрутки (уезжает вместе с содержимым и оставляет в панели
   компактный), строки собраны в скруглённые группы с воздухом по бокам.
   ========================================================================== */
function nav(title, opts) {
  const o = opts || {};
  /* На экранах без крупного заголовка (открытая запись) название стоит в панели
     сразу; на остальных проступает, когда крупный уезжает вверх. */
  return `
    <div class="m-nav${o.titleAlways ? ' is-scrolled' : ''}" id="nav">
      ${o.back ? `<button class="fm-btn fm-btn--icon" data-back="1" aria-label="Назад">${ic(OS === 'android' ? I.back : I.backIos, 'fm-i--l')}</button>`
              : `<span style="width:var(--space-m)"></span>`}
      <span class="m-nav__compact m-head">${title}</span>
      <span class="m-nav__acts">${o.acts || ''}</span>
    </div>`;
}
const large = (title, sub) => `
  <div class="m-large-block">
    <h1 class="m-large" style="margin:0">${title}</h1>
    ${sub ? `<p class="m-sub m-dim" style="margin:0">${sub}</p>` : ''}
  </div>`;

/* ======================== ЭКРАН: ПАПКИ (главный) ==========================
   Разделы записей — отдельный экран, а не полоса фильтров над списком: на
   телефоне в раздел ЗАХОДЯТ, и тогда у списка остаётся один смысл — записи
   выбранного раздела. Так устроен системный «Диктофон»: папки со счётчиками,
   внутри — записи.
   ========================================================================== */
function screenFolders() {
  const q = stats();
  const smart = [
    { kind: 'all', label: 'Все записи', icon: I.files },
    { kind: 'unfiled', label: 'Без папки', icon: I.unfiled },
    { kind: 'trash', label: 'Корзина', icon: I.trash }
  ];
  const row = (kind, value, label, icon, color) => `
    <div class="m-row m-row--inset" data-scope="${kind}" data-value="${esc(value || '')}">
      ${color ? `<span class="m-row__dot" style="background:${color};margin:0 8px"></span>`
               : `<span class="m-row__ico">${ic(icon)}</span>`}
      <span class="m-row__body m-body">${label}</span>
      <span class="m-row__right">
        <span class="m-row__val m-body m-num">${cnt(kind, value)}</span>
        ${ic(I.go, 'fm-i--s m-row__chev')}
      </span>
    </div>`;
  return nav(t('Записи'), {
    acts: `<button class="fm-btn fm-btn--icon" data-sheet="newfolder" aria-label="${t('Новая папка')}">${ic(I.plus, 'fm-i--l')}</button>`
  })
  + `<div class="m-scroll m-scroll--fab" id="scroll">
      ${large(t('Записи'), `${q.n} ${plZap(q.n)} · ${num(q.hours, 1)} ${t('ч')}`)}
      <!-- Состояние, в котором сотрудник окажется чаще всего: связь и очередь
           отправки. Полоса нажимается и ведёт на экран отправки. -->
      ${!LINK.live ? `<div class="m-linkbar is-off">
          <span class="m-linkbar__dot"></span>
          <span class="m-linkbar__txt m-cap">${t('Связи нет — запись доедет, живых подсказок нет')}</span>
        </div>` : ''}
      ${micFallback() ? `<div class="m-warn m-cap">${ic(I.alert, 'fm-i--s')}
        <span>${t('Диктофон не на связи — записывает микрофон телефона.')}</span></div>` : ''}
      ${isMandatory() ? `<div class="m-warn m-cap">${ic(I.lock, 'fm-i--s')}
        <span>${t('Организация включила режим «запись обязательна»: встречи записываются, прервать запись нельзя.')}</span></div>` : ''}
      ${!ORG.server ? `<div class="m-warn m-warn--danger m-cap">${ic(I.alert, 'fm-i--s')}
        <span>${t('Сервер организации не задан. Запись не начинается.')}</span></div>` : ''}
      ${recSessionCardHtml('m')}
      <div class="m-group">${smart.map(x => row(x.kind, null, t(x.label), x.icon)).join('')}</div>
      <div class="m-grouphead m-cap">${t('Папки')}</div>
      <div class="m-group">${FOLDERS.map(f => row('folder', f.name, esc(f.name), null, f.color)).join('')}</div>
      <div class="m-bottom"></div>
    </div>`;
}

/* ─── Строка записи и деление списка по времени ─────────────────────────────
   Список группируется по времени — так «то, что было вчера» находится без
   поиска и сортировки; внутри группы дата уже не повторяется, остаётся время.
   При другом порядке (по названию, по длительности) деление по дням теряет
   смысл: тогда группа одна, а её подпись называет выбранный порядок. */
const SORTS = [['date', 'По времени'], ['name', 'По названию'], ['dur', 'По длительности']];
const SORT_LABEL = Object.fromEntries(SORTS);
function byDay(list) {
  if (M.sort !== 'date') return [{ label: t(SORT_LABEL[M.sort] || ''), items: list }];
  const out = [], seen = new Map();
  list.forEach(f => {
    const k = dayKey(f);
    if (!seen.has(k)) { const g = { label: fmtDayGroup(f.ts), items: [] }; seen.set(k, g); out.push(g); }
    seen.get(k).items.push(f);
  });
  return out;
}
const fmtTimeOnly = ts => { const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
function fileRow(f, timeOnly) {
  const pv = preview(f);
  return `<div class="m-row m-row--inset" data-file="${f.id}">
      <span class="m-row__body">
        <span class="m-row__title m-body">${esc(f.title)}</span>
        ${pv === null
          ? `<span class="m-row__prev m-sub m-row__prev--wait">${ic(I.spin, 'fm-i--s')}<span>${t('Расшифровываем…')}</span></span>`
          : pv ? `<span class="m-row__prev m-sub">${esc(pv)}</span>` : ''}
        <span class="m-row__meta m-cap">
          ${recListTagHtml(f)}
          ${f.folder ? `<span class="m-row__dot" style="background:${folderColor(f.folder)}"></span>` : ''}
          <span class="m-num">${esc(timeOnly ? fmtTimeOnly(f.ts) : fmtShort(f.ts))}</span>
          <span class="m-sep">·</span><span class="m-num">${esc(fmtDurShort(f.sec))}</span>
        </span>
      </span>
      <button class="m-row__act" data-rowmenu="${f.id}" aria-label="${t('Ещё')}">${ic(I.more)}</button>
    </div>`;
}

/* ==================== ЭКРАН: ЗАПИСИ ВЫБРАННОГО РАЗДЕЛА ==================== */
function screenFiles() {
  const r = rows();
  const list = r.length ? byDay(r).map(g => `
      <div class="m-grouphead m-cap">${esc(g.label)}</div>
      <div class="m-group">${g.items.map(f => fileRow(f, M.sort === 'date')).join('')}</div>`).join('')
    : `<div class="m-empty">
        ${ic(M.scope.kind === 'trash' ? I.trash : I.files, 'fm-i--xl m-empty__icon')}
        <h2 class="m-title">${M.scope.kind === 'trash' ? 'Корзина пуста' : 'Записей нет'}</h2>
        <p class="m-sub">${M.scope.kind === 'trash' ? 'Удалённые записи хранятся здесь 30 дней.' : 'Нажмите круглую кнопку записи, чтобы записать встречу.'}</p>
      </div>`;
  const hours = r.reduce((a, f) => a + f.sec, 0) / 3600;
  return nav(esc(scopeTitle()), {
    back: true,
    acts: `<button class="fm-btn fm-btn--icon" data-sheet="sort" aria-label="${t('Порядок')}">${ic(I.sort, 'fm-i--l')}</button>`
  })
  + `<div class="m-scroll m-scroll--fab" id="scroll">
      ${large(esc(scopeTitle()), `${r.length} ${plZap(r.length)} · ${num(hours, 1)} ${t('ч')}`)}
      ${list}
      <div class="m-bottom"></div>
    </div>`;
}

/* ============================ ЭКРАН: ПОИСК ================================ */
function screenSearch() {
  const r = M.q.trim() ? FILES.filter(f => !f.deleted && matchQ(f, M.q)) : [];
  const body = !M.q.trim()
    ? `<div class="m-empty">${ic(I.search, 'fm-i--xl m-empty__icon')}
        <h2 class="m-title">${t('Что ищем?')}</h2>
        <p class="m-sub">${t('Ищем по названию записи, говорящим и тексту разговора — во всех')} ${alive().length} ${plZapV(alive().length)}.</p></div>`
    : !r.length
    ? `<div class="m-empty">${ic(I.search, 'fm-i--xl m-empty__icon')}
        <h2 class="m-title">${t('Ничего не нашли')}</h2>
        <p class="m-sub">${t('Попробуйте другое слово: ищем по названию, говорящим и тексту разговора.')}</p></div>`
    : `<div class="m-grouphead m-cap">${t('нашли')} ${r.length} ${plZap(r.length)}</div>
       ${r.map(f => {
         /* Найденное показываем цитатой с её временем и уводим прямо в это
            место записи: ответ «где это сказали», а не «в какой записи искать».
            Совпало только название — цитаты нет, и придумывать её нельзя. */
         const hits = segsOf(f).filter(s => matchSeg(s, M.q)).slice(0, 2);
         return `<div class="m-group">
           <div class="m-row m-row--inset" data-file="${f.id}">
             <span class="m-row__body">
               <span class="m-row__title m-body">${hl(f.title, M.q)}</span>
               <span class="m-row__meta m-cap"><span class="m-num">${esc(fmtShort(f.ts))}</span>
                 <span class="m-sep">·</span><span class="m-num">${esc(fmtDurShort(f.sec))}</span></span>
             </span>${ic(I.go, 'fm-i--s m-row__chev')}
           </div>
           ${hits.map(s => `<button class="m-hitrow" data-file="${f.id}" data-at="${s.sec}">
             <span class="m-time m-cap">${esc(s.time)}</span>
             <span class="m-hitrow__txt m-sub">${
               /* Бюджет цитаты — то, что влезает в две строки, минус имя
                  говорящего: иначе окно вокруг найденного слова обрезает уже
                  разметка, и подсветка снова уезжает за край. */
               hl(s.who + ': ' + snippet(s.text, M.q, Math.max(40, 70 - s.who.length)), M.q)}</span>
           </button>`).join('')}
         </div>`;
       }).join('')}`;
  return nav(t('Поиск'), { back: true })
    + `<div class="m-scroll" id="scroll">
        ${large(t('Поиск'))}
        <div class="m-pad" style="padding-bottom:var(--size-4x)">
          <div class="m-searchwrap">${ic(I.search)}
            <input class="fm-input" id="q" value="${esc(M.q)}" autocomplete="off"
              placeholder="${t('Название, говорящий или слово из разговора')}">
          </div>
        </div>
        ${body}<div class="m-bottom"></div>
      </div>`;
}

/* ============================ ЭКРАН: ЗАПИСЬ =============================== */
const posOf = f => Math.max(0, Math.min(f.sec, f.at || 0));
let playTimer = null;
function paintPlayer() {
  const f = file(), w = $('#wave'); if (!f || !w) return;
  const at = posOf(f), pos = f.sec ? at / f.sec * WAVE_N : 0;
  [...w.children].forEach((b, i) => b.classList.toggle('is-played', i < pos));
  document.querySelectorAll('#plAt, #plAtFull').forEach(el =>
    el.textContent = fmtTotal(Math.round(at)));
  const left = $('#plLeft');
  if (left) left.textContent = '−' + fmtTotal(Math.max(0, Math.round(f.sec - at)));
  $('#btnPlay').innerHTML = M.playing
    ? `<svg class="fm-i fm-i--l" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>`
    : `<svg class="fm-i fm-i--l" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M8.5 5.2l11 6.8-11 6.8z"/></svg>`;
  const mb = $('#btnMark');
  if (mb) mb.classList.toggle('is-on', marksOf(f.id).includes(curSeg(f)));
  paintNow();
}
/* Прокрутка ВНУТРИ содержимого экрана, а не страницей: scrollIntoView тянет
   все прокручиваемые предки и уводит вверх сам корпус телефона. */
function scrollWithin(el, center) {
  const sc = $('#scroll'); if (!sc || !el) return;
  const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;
  if (center) { sc.scrollTop = Math.max(0, top - sc.clientHeight / 2 + el.offsetHeight / 2); return; }
  const view = top - sc.scrollTop;
  if (view < 0) sc.scrollTop = top - SEG_AIR;
  else if (view + el.offsetHeight > sc.clientHeight) sc.scrollTop = top + el.offsetHeight - sc.clientHeight + SEG_AIR;
}
const SEG_AIR = 24;            // воздух вокруг подъехавшей реплики, шестая ступень шкалы 4px
/* Подсветка звучащего места. Текст и звук сшиты: пока идёт проигрывание,
   реплика сама подъезжает к глазам; при остановке — не дёргаем прокрутку. */
function paintNow() {
  const f = file(); if (!f) return;
  const cs = curSeg(f);
  document.querySelectorAll('.m-seg-row').forEach(el => {
    const on = +el.dataset.seg === cs;
    if (on !== el.classList.contains('is-now')) {
      el.classList.toggle('is-now', on);

   разговоре слово стоит в другом — своё точное вхождение здесь давало «ничего

/* ═══════════ ЭКРАН: ДИКТОФОНЫ ════════════════════════════════════════════
   Продукт направления — устройство, и телефон в этой паре главный: диктофон
   подключается к нему по Bluetooth. Поэтому здесь не «настройка», а свой
   экран: заряд, память, новые записи, состояние связи и сами записи.
   antd: <List> + <Card>. */
const devLinkTag = d => d.link === 'off'
  ? `<span class="fm-tag fm-tag--red">${t('Не на связи')}</span>`
  : `<span class="fm-tag fm-tag--green">${t('На связи')}</span>`;
function devBlock(d) {
  const off = d.link === 'off';
  const recs = devRecs(d.id);
  return `
    <div class="m-group">
      <div class="m-row m-row--inset" style="cursor:default">
        <span class="m-row__ico">${ic(I.device)}</span>
        <span class="m-row__body">
          <span class="m-row__title m-body">${esc(d.name)}</span>
          <span class="m-row__meta m-row__meta--wrap m-cap"><span><span>${t('серийный номер')}</span> ${esc(d.serial)}</span></span>
        </span>
        <span class="m-row__right">${devLinkTag(d)}</span>
      </div>
      <div class="m-row m-row--inset" style="cursor:default">
        <span class="m-row__body m-body">${t('Новых записей')}</span>
        <span class="m-row__right"><span class="m-row__val m-body m-num">${recs.length}</span></span>
      </div>
    </div>
    ${off ? `<div class="m-warn m-cap">${ic(I.alert, 'fm-i--s')}
      <span>${t('Диктофон не на связи.')}</span></div>` : ''}
    ${recs.length ? `<div class="m-group">
      ${recs.map(r => `<div class="m-row m-row--inset">
          <span class="m-row__body">
            <span class="m-row__title m-body">${esc(r.title)}</span>
            <span class="m-row__meta m-cap"><span class="m-num">${esc(fmtShort(r.ts))}</span>
              <span class="m-sep">·</span><span class="m-num">${esc(fmtDurShort(r.sec))}</span></span>
          </span>
        </div>`).join('')}
      </div>
      <p class="m-pad m-cap m-dim">${t('Эти записи ждут загрузки на сервер компании. Сначала их нужно перенести на телефон — тогда загрузка начнётся.')}</p>` : ''}`;
}

        : (compact ? 'Связи нет — запись доедет, живых подсказок нет' : 'Связи с сервером нет. Запись доедет, когда связь появится, — живых подсказок нет.'))}</span>

const SHEETS = {
  sort: () => sheet(t('Порядок записей'),

  speed: () => sheet(t('Скорость'), SPEEDS.map(v => item(I.clock, fmtSpeed(v), `data-speed="${v}"`, M.speed === v))),
  /* Полный пульт: то, чему не место в одной строке аксессуара. */
  player: () => {
    const f = file(); if (!f) return sheet('', []);
    const at = posOf(f);
    return `<div class="fm-sheet__head"><span class="m-title">${t('Проигрыватель')}</span></div>
      <div class="fm-sheet__body m-pad">
        <div class="m-times m-cap m-num"><span id="plAtFull">${fmtTotal(Math.round(at))}</span>
          <span id="plLeft">−${fmtTotal(Math.max(0, Math.round(f.sec - at)))}</span></div>
        <div class="m-ctrls" style="justify-content:center">
          ${seek(-1)}
          <button class="m-play" data-playtoggle="1" aria-label="${t('Воспроизвести')}">
            ${M.playing ? ic(I.pause, 'fm-i--l') : `<svg class="fm-i fm-i--l" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M8.5 5.2l11 6.8-11 6.8z"/></svg>`}
          </button>
          ${seek(1)}
        </div>
        <p class="m-cap m-dim" style="margin:var(--size-5x) 0 var(--space-m)">${t('Скорость')}</p>
        <div style="display:flex;flex-wrap:wrap;gap:var(--space-m)">${SPEEDS.map(v =>
          `<button class="m-speed ${v === M.speed ? 'is-on' : ''}" data-speed="${v}">${fmtSpeed(v)}</button>`).join('')}</div>
      </div>`;
  },
  /* Источник записи — это НЕ только микрофоны: диктофон стоит в том же
     выборе, под своим именем. Иначе устройство направления в приложении
     невидимо, а спрашивают именно про него. Диктофон не на связи выбрать
